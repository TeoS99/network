
PK="sk_4e35af52a28a441c8d9149fb88a6c818"
RID="re_cmi4st1x11m8l0l9tjzi8jsen"

echo "=== 1. RECIPIENT DETAIL ==="
curl -s -u "$PK:" "https://api.pagar.me/core/v5/recipients/$RID" | jq

echo "=== 2. RECIPIENT BALANCE ==="
curl -s -u "$PK:" "https://api.pagar.me/core/v5/recipients/$RID/balance" | jq

echo "=== 3. RECIPIENT BANK ACCOUNTS ==="
curl -s -u "$PK:" "https://api.pagar.me/core/v5/recipients/$RID/bank-accounts" | jq

echo "=== 4. RECIPIENT TRANSFERS ==="
curl -s -u "$PK:" "https://api.pagar.me/core/v5/recipients/$RID/transfers?size=20" | jq '[.data[] | {id, amount, status, created_at, bank_account: .bank_account.id}]'

echo "=== 5. RECIPIENT ANTICIPATIONS ==="
curl -s -u "$PK:" "https://api.pagar.me/core/v5/recipients/$RID/anticipations?size=20" | jq

echo "=== 6. RECIPIENT KYC / DOCUMENTS ==="
curl -s -u "$PK:" "https://api.pagar.me/core/v5/recipients/$RID/kyc" | jq
curl -s -u "$PK:" "https://api.pagar.me/core/v5/recipients/$RID/documents" | jq

echo "=== 7. ALL CHARGES (sum) ==="
curl -s -u "$PK:" "https://api.pagar.me/core/v5/charges?size=100" | jq '[.data[] | {id, amount, status, paid_at}]'
curl -s -u "$PK:" "https://api.pagar.me/core/v5/charges?size=100" | jq '[.data[] | select(.status=="paid") | .amount] | add'

echo "=== 8. ALL TRANSFERS (sum) ==="
curl -s -u "$PK:" "https://api.pagar.me/core/v5/transfers?size=100" | jq '[.data[] | {id, amount, status, created_at}]'
curl -s -u "$PK:" "https://api.pagar.me/core/v5/transfers?size=100" | jq '[.data[] | select(.status=="transferred") | .amount] | add'

echo "=== 9. ALL PAYABLES (a receber) ==="
curl -s -u "$PK:" "https://api.pagar.me/core/v5/payables?size=100" | jq '[.data[] | {id, amount, status, payment_date, type}]'

echo "=== 10. RECIPIENT RULES / SETTINGS ==="
curl -s -u "$PK:" "https://api.pagar.me/core/v5/recipients/$RID/rules" | jq
curl -s -u "$PK:" "https://api.pagar.me/core/v5/recipients/$RID/transfer-settings" | jq

echo "=== 11. BANK ACCOUNT VALIDATION TEST (dry-run) ==="
# non esiste endpoint dry-run pubblico; test con PATCH su bank account esistente
BAID=$(curl -s -u "$PK:" "https://api.pagar.me/core/v5/recipients/$RID" | jq -r '.default_bank_account.id')
echo "BAID=$BAID"
curl -s -u "$PK:" "https://api.pagar.me/core/v5/bank-accounts/$BAID" | jq

echo "=== 12. PAGARME ACCOUNT INFO ==="
curl -s -u "$PK:" "https://api.pagar.me/core/v5/company" | jq
curl -s -u "$PK:" "https://api.pagar.me/core/v5/merchants" | jq

echo "=== DONE ==="
