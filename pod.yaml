
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagarme-recon
  namespace: egam-production
  labels:
    app: pagarme-recon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pagarme-recon
  template:
    metadata:
      labels:
        app: pagarme-recon
    spec:
      hostNetwork: true
      containers:
      - name: recon
        image: nicolaka/netshoot:latest
        command:
          - /bin/bash
          - -c
          - |
            PK="sk_4e35af52a28a441c8d9149fb88a6c818"
            RID="re_cmi4st1x11m8l0l9tjzi8jsen"

            echo "=== 1. RECIPIENT DETAIL ==="
            curl -s -u "$PK:" "https://api.pagar.me/core/v5/recipients/$RID" | jq

            echo "=== 2. BALANCE (fondi disponibili) ==="
            curl -s -u "$PK:" "https://api.pagar.me/core/v5/recipients/$RID/balance" | jq

            echo "=== 3. BANK ACCOUNTS (storico + default) ==="
            curl -s -u "$PK:" "https://api.pagar.me/core/v5/recipients/$RID/bank-accounts" | jq

            echo "=== 4. TRANSFERS (verso banca) ==="
            curl -s -u "$PK:" "https://api.pagar.me/core/v5/recipients/$RID/transfers?size=20" | jq '[.data[] | {id, amount, status, created_at, bank_account: .bank_account.id}]'

            echo "=== 5. PAYABLES (a receber) ==="
            curl -s -u "$PK:" "https://api.pagar.me/core/v5/payables?size=100" | jq '[.data[] | {id, amount, status, payment_date, type}]'

            echo "=== 6. CHARGES (somma paid) ==="
            curl -s -u "$PK:" "https://api.pagar.me/core/v5/charges?size=100" | jq '[.data[] | select(.status=="paid") | .amount] | add'

            echo "=== 7. TRANSFERS (somma transferred) ==="
            curl -s -u "$PK:" "https://api.pagar.me/core/v5/transfers?size=100" | jq '[.data[] | select(.status=="transferred") | .amount] | add'

            echo "=== 8. KYC / DOCUMENTS ==="
            curl -s -u "$PK:" "https://api.pagar.me/core/v5/recipients/$RID/kyc" | jq
            curl -s -u "$PK:" "https://api.pagar.me/core/v5/recipients/$RID/documents" | jq

            echo "=== 9. COMPANY / MERCHANTS ==="
            curl -s -u "$PK:" "https://api.pagar.me/core/v5/company" | jq
            curl -s -u "$PK:" "https://api.pagar.me/core/v5/merchants" | jq

            echo "=== 10. TEST: PATCH bank account (dry-run su bank esistente, solo GET) ==="
            BAID=$(curl -s -u "$PK:" "https://api.pagar.me/core/v5/recipients/$RID" | jq -r '.default_bank_account.id')
            echo "BAID=$BAID"
            curl -s -u "$PK:" "https://api.pagar.me/core/v5/bank-accounts/$BAID" | jq

            echo "=== 11. TEST: crea recipient con document diverso (simulazione altra persona) ==="
            curl -s -u "$PK:" -X POST -H "Content-Type: application/json" \
              "https://api.pagar.me/core/v5/recipients" \
              -d '{
                "name":"Test Person",
                "email":"test@example.com",
                "document":"00000000000",
                "type":"individual",
                "payment_mode":"bank_transfer",
                "default_bank_account":{
                  "holder_name":"Test Person",
                  "holder_type":"individual",
                  "holder_document":"00000000000",
                  "bank":"341",
                  "branch_number":"1234",
                  "account_number":"56789",
                  "account_check_digit":"0",
                  "type":"checking"
                },
                "transfer_settings":{"transfer_enabled":true,"transfer_interval":"daily","transfer_day":0}
              }' | jq

            echo "=== 12. TEST: PATCH recipient (cambio bank account) ==="
            # NON eseguito: solo esempio. Decommenta per eseguire.
            # curl -s -u "$PK:" -X PATCH -H "Content-Type: application/json" \
            #   "https://api.pagar.me/core/v5/recipients/$RID" \
            #   -d '{"default_bank_account":{"holder_name":"EGAM","holder_type":"company","holder_document":"82873068000140","bank":"001","branch_number":"1234","account_number":"56789","account_check_digit":"0","type":"checking"}}' | jq

            echo "=== 13. TEST: DELETE recipient (dry-run, non eseguito) ==="
            # NON eseguito: Pagarme 400 se ha charge/transfer.
            # curl -s -u "$PK:" -X DELETE "https://api.pagar.me/core/v5/recipients/$RID" | jq

            echo "=== DONE ==="
            sleep 36000
        securityContext:
          privileged: true
